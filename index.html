<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFI Order Communications</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --ink:#1d1f20; --paper:#f2f2f3; --surface:#e9e9ea; --white:#fff; --field:#f5f5f8;
  --line:rgba(29,31,32,.16); --line-strong:rgba(29,31,32,.3); --line-soft:rgba(29,31,32,.12);
  --muted:#5d5d60; --muted-2:#7a7a7d; --faint:#98989b;
  --steel:#416180; --steel-tint:#eef6ff; --steel-edge:#94bce3;
  --red:#EE1C24; --red-dark:#BB1219; --red-tint:#fde8e9;
  --amber:#9a6a00; --amber-tint:#fff4d6; --ok:#2E7D52; --ok-tint:#e6f3ec; --on-ink:#fff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#e8e8ea; --paper:#17191a; --surface:#202324; --white:#25292b; --field:#1d2022;
  --line:rgba(232,232,234,.14); --line-strong:rgba(232,232,234,.28); --line-soft:rgba(232,232,234,.1);
  --muted:#b4b4b8; --muted-2:#9a9a9e; --faint:#7d7d81;
  --steel:#8fb3d9; --steel-tint:#1f2c3a; --steel-edge:#4f6f8f;
  --red-tint:#3a1c1e; --amber:#e8b43a; --amber-tint:#352b12; --ok:#6fc28f; --ok-tint:#173324; --on-ink:#17191a;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e8e8ea; --paper:#17191a; --surface:#202324; --white:#25292b; --field:#1d2022;
  --line:rgba(232,232,234,.14); --line-strong:rgba(232,232,234,.28); --line-soft:rgba(232,232,234,.1);
  --muted:#b4b4b8; --muted-2:#9a9a9e; --faint:#7d7d81;
  --steel:#8fb3d9; --steel-tint:#1f2c3a; --steel-edge:#4f6f8f;
  --red-tint:#3a1c1e; --amber:#e8b43a; --amber-tint:#352b12; --ok:#6fc28f; --ok-tint:#173324; --on-ink:#17191a;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:var(--cond);margin:0;}
button,input,select,textarea{font-family:inherit;color:inherit;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
.hidden{display:none!important;}
.mono{font-family:var(--mono);}

/* header: stays white, like the other CFI portals */
header{background:#fff;color:#1d1f20;border-bottom:3px solid var(--red);padding:12px 24px 12px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px 28px;}
.brand{display:inline-block;justify-self:start;}
.brand img{width:0;min-width:100%;height:auto;display:block;}
.brand .wordmark{margin-top:5px;border-top:1px solid rgba(29,31,32,.22);padding-top:4px;font-family:var(--cond);font-weight:700;font-size:17px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;color:#1d1f20;white-space:nowrap;display:block;}
nav.pages{display:flex;gap:4px;}
nav.pages a{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#7a7a7d;text-decoration:none;padding:10px 12px;border-bottom:2px solid transparent;}
nav.pages a:hover{color:#1d1f20;}
nav.pages a[aria-current="page"]{color:#1d1f20;border-bottom-color:#1d1f20;}
nav.pages .n{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--red);color:#fff;padding:2px 6px;margin-left:7px;vertical-align:2px;}
.hdr-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
.viewsw{display:flex;border:1px solid #1d1f20;}
.viewsw button{min-height:40px;padding:0 14px;border:0;background:#fff;color:#424244;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
.viewsw button+button{border-left:1px solid #1d1f20;}
.viewsw button[aria-pressed="true"]{background:#1d1f20;color:#fff;}
@media (max-width:820px){header{grid-template-columns:1fr auto;}nav.pages{grid-column:1/-1;grid-row:2;}}
@media (max-width:560px){header{grid-template-columns:1fr;padding:12px 14px;}nav.pages{grid-row:auto;}.hdr-r{justify-content:flex-start;}.viewsw button{padding:0 12px;}.kpis{padding:0 14px;}.kpi{padding:9px 14px 9px 0;margin-right:14px;}}

/* buttons */
.btn-red{min-height:44px;padding:0 20px;border:1px solid var(--red-dark);background:var(--red);color:#fff;font-family:var(--cond);font-weight:600;font-size:14.5px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;border-radius:0;}
.btn-red:hover{background:var(--red-dark);}
.btn-red:disabled{opacity:.45;cursor:default;}
.btn-ghost{min-height:44px;padding:0 16px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:0;}
.btn-ghost:hover{border-color:var(--ink);}
.btn-sm{min-height:32px;padding:0 10px;font-size:11px;}
.btn-link{background:none;border:0;padding:0;color:var(--muted-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.btn-link:hover{color:var(--red-dark);}
.btn-ok{min-height:34px;padding:0 12px;border:1px solid var(--ok);background:transparent;color:var(--ok);font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0;white-space:nowrap;}
.btn-ok:hover{background:var(--ok);color:var(--on-ink);}
.up{text-transform:uppercase;letter-spacing:.03em;}
.hi{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--red);border:1px solid var(--red);padding:0 4px;vertical-align:1px;}
.rq-line{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;}
.chevbtn{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted-2);cursor:pointer;transition:transform .25s ease;}
.rq.open .chevbtn{transform:rotate(180deg);}
.pill.redo{color:var(--red);}
.big{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.06em;}
table.ans .pcol{display:none;}table.ans.partial .pcol{display:table-cell;}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr));}
.perf{background:var(--white);border:1px solid var(--line);padding:12px 16px;margin-bottom:16px;}
.c-act{display:flex;justify-content:flex-end;padding-right:12px;}
.rq-head{cursor:default;padding-top:0;padding-bottom:7px;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);}
.rq-head:hover{background:transparent;}
.rq-headline{border-bottom:1px solid var(--line-strong);}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;}
.cardhead h3{margin:0;}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.reason.prod{border-left-color:var(--ok);}
.res-h{cursor:default;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding-top:4px;padding-bottom:6px;border-bottom:1px solid var(--line-strong);}
.res-h:hover{background:transparent;}
.c-type,.c-date,.lbl,.ready,.missed,.empty,.toast,.isub{text-transform:uppercase;}
.isub{letter-spacing:.03em;font-size:11px;}
.search{text-transform:uppercase;}

/* KPI strip */
.kpis{display:flex;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;}
.kpi{padding:11px 24px 11px 0;margin-right:24px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:8px;}
.kpi:last-child{border-right:0;}
.kpi b{font-family:var(--cond);font-weight:600;font-size:24px;line-height:1;}
.kpi b.red{color:var(--red);}
.kpi span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

/* layout */
.page{max-width:1160px;margin:0 auto;padding:24px 24px 70px;}
.split{display:flex;align-items:stretch;min-height:calc(100vh - 160px);}
.rail{width:212px;flex-shrink:0;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:24px;}
.main{flex:1;min-width:0;padding:20px 24px 70px;}
.tabs{display:flex;flex-direction:column;border:1px solid var(--ink);}
.tab-btn{min-height:50px;padding:0 14px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-align:left;background:var(--white);color:var(--muted);}
.tab-btn+.tab-btn{border-top:1px solid var(--ink);}
.tab-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
.tab-btn .count{font-family:var(--mono);font-weight:400;opacity:.75;font-size:12px;}
.rail-label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px;}
.sorts{display:flex;flex-direction:column;gap:1px;}
.sort-btn{min-height:38px;padding:0 12px;border:1px solid var(--line-strong);cursor:pointer;text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--white);color:var(--muted);}
.sort-btn[aria-pressed="true"]{background:var(--steel-tint);border-color:var(--steel-edge);color:var(--steel);}
@media (max-width:760px){.split{flex-direction:column;}.rail{width:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;gap:12px;padding:14px;}.tabs{flex-direction:row;flex-wrap:wrap;}.tab-btn{min-height:42px;}.tab-btn+.tab-btn{border-top:0;border-left:1px solid var(--ink);}.sorts{flex-direction:row;}.main{padding:16px 14px 60px;}.page{padding:18px 14px 60px;}}

h2.sec{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:600;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;}
h2.sec .c{font-family:var(--mono);color:var(--muted-2);font-weight:400;}
.block{margin-bottom:34px;}
.empty{padding:22px 16px;color:var(--muted-2);font-size:14px;background:var(--white);border:1px solid var(--line);}
.search{width:100%;max-width:520px;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:0;background:var(--field);font-size:13px;font-weight:500;letter-spacing:.08em;margin-bottom:16px;}
.search::placeholder{color:var(--faint);text-transform:uppercase;letter-spacing:.12em;}

/* request rows */
.rqs{}
.rq{border-bottom:1px solid var(--line-soft);}
.rq-row{width:100%;display:grid;grid-template-columns:4px 64px minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) 130px;gap:0 14px;align-items:center;padding:11px 12px 11px 0;background:transparent;border:0;text-align:left;cursor:pointer;}
.rq-line{transition:background .12s ease;}
.rq>.rq-line:hover{background:var(--white);}
.rq.open>.rq-line,.rq.open>.rq-line:hover{background:var(--steel-tint);box-shadow:inset 0 0 0 1px var(--steel-edge);}
.c-act{cursor:pointer;align-self:stretch;align-items:center;}
.late-l{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--red);margin-top:2px;}
.sub-l{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted-2);margin-top:2px;}
.rnd{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--amber);border:1px solid var(--amber);padding:0 4px;vertical-align:1px;}
.c-date small.red{color:var(--red);font-weight:700;}
.toast button{margin-left:16px;background:none;border:1px solid currentColor;color:inherit;font:inherit;letter-spacing:.1em;padding:3px 10px;cursor:pointer;}
.reason.counter{border-left-color:var(--amber);}
.tick{width:4px;align-self:stretch;}
.c-id{font-family:var(--mono);font-size:12px;color:var(--muted-2);}
.c-so{font-family:var(--mono);font-weight:700;font-size:14px;margin-right:10px;}
.c-cust{font-size:14px;}
.c-main{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-type{font-size:13.5px;}
.c-type small,.c-date small{display:block;font-size:11.5px;color:var(--muted-2);}
.c-date{font-size:13.5px;}
.chev{width:26px;height:26px;display:grid;place-items:center;color:var(--muted-2);transition:transform .25s ease;}
.rq.open .chev{transform:rotate(180deg);}
@media (max-width:860px){.rq-headline{display:none;}.rq-line{grid-template-columns:minmax(0,1fr) auto;}.rq-row{grid-template-columns:4px minmax(0,1fr) auto;gap:3px 12px;padding-left:0;}.rq-row>.tick{grid-row:1/span 4;}.c-id{grid-column:2;}.c-main{grid-column:2;white-space:normal;}.c-type,.c-date{grid-column:2;}.c-st{grid-column:3;grid-row:1;}.chev{grid-column:3;grid-row:2;}}

.pill{display:inline-block;border:1px solid currentColor;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;padding:4px 8px;white-space:nowrap;font-weight:600;}
.pill.steel{color:var(--steel);} .pill.amber{color:var(--amber);background:var(--amber-tint);border-color:transparent;} .pill.ok{color:var(--ok);} .pill.red{color:#fff;background:var(--red);border-color:var(--red-dark);} .pill.muted{color:var(--muted-2);border-color:var(--line-strong);}
.t-steel{background:var(--steel);} .t-redo{background:var(--red);} .t-amber{background:var(--amber);} .t-ok{background:var(--ok);} .t-red{background:var(--red);} .t-muted{background:var(--line-strong);}

/* expanded request */
.rq-panel{background:var(--field);border-top:1px solid var(--line-soft);padding:22px 24px 26px;}
@media (max-width:760px){.rq-panel{padding:16px 12px 20px;}}
.facts{display:flex;gap:16px 34px;flex-wrap:wrap;margin-bottom:16px;}
.fact .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);}
.fact .v{font-size:15px;margin-top:3px;}
.fact .v.big{font-family:var(--cond);font-weight:600;font-size:20px;line-height:1.1;}
.fact .v.ok{color:var(--ok);} .fact .v.red{color:var(--red);}
.reason{background:var(--white);border-left:3px solid var(--steel);padding:10px 14px;font-size:14px;margin-bottom:16px;}
.reason .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:2px;}
.card{background:var(--white);padding:18px 20px;margin-bottom:16px;border:1px solid var(--line);}
.card h3{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:600;margin:0 0 12px;}
.card.accent{border-top:3px solid var(--ink);}

table.it{width:100%;border-collapse:collapse;border-top:1px solid var(--line);}
table.it th{white-space:nowrap;text-align:left;font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding:8px 10px 6px 0;border-bottom:1px solid var(--line-strong);}
table.it td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:14px;}
table.it .r{text-align:right;}
.iname{font-weight:600;font-family:var(--mono);font-size:13.5px;}
.isub{font-size:11.5px;color:var(--muted-2);margin-top:1px;}
.scroll{max-height:360px;overflow:auto;}
.dueline{display:block;white-space:nowrap;}
.ready{color:var(--ok);font-weight:600;} .missed{color:var(--red);font-weight:600;}

input[type="checkbox"].bx{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:1px solid var(--line-strong);background:var(--white);cursor:pointer;display:grid;place-items:center;margin:0;border-radius:0;}
input[type="checkbox"].bx:checked{background:var(--red);border-color:var(--red-dark);}
input[type="checkbox"].bx:checked::after{content:"";width:12px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-2px);}
.qin{width:110px;min-height:38px;padding:0 10px;border:1px solid var(--line-strong);border-radius:0;font-family:var(--mono);font-weight:700;font-size:15px;text-align:center;background:var(--white);}
.qin:disabled{opacity:.4;}
.din{min-height:42px;padding:0 10px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);font-size:15px;}
.ta{width:100%;min-height:64px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);font-size:14.5px;resize:vertical;}
.sel{min-height:42px;padding:0 10px;border:1px solid var(--line-strong);border-radius:0;background:var(--white);font-size:14.5px;}
.lbl{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin:14px 0 5px;}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-size:12px;}
.row{display:flex;gap:12px 18px;align-items:flex-end;flex-wrap:wrap;}
.err{color:var(--red-dark);font-size:13px;font-weight:600;margin-top:10px;min-height:1px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.hint{font-size:12px;color:var(--muted-2);}

/* answer choices */
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ink);margin-bottom:6px;}
.choices button{min-height:58px;padding:8px 12px;border:0;background:var(--white);cursor:pointer;text-align:left;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2;}
.choices button small{display:block;font-family:var(--sans);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);margin-top:2px;}
.choices button+button{border-left:1px solid var(--ink);}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
.choices button[aria-pressed="true"] small{color:var(--paper);opacity:.75;}
@media (max-width:760px){.choices{grid-template-columns:1fr 1fr;}.choices button:nth-child(3){border-left:0;}.choices button:nth-child(n+3){border-top:1px solid var(--ink);}}
.restbox{display:flex;gap:12px 18px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:var(--field);border:1px dashed var(--line-strong);}

details.more{margin-top:4px;}
details.more summary{cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:8px 0;list-style:none;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::before{content:"+ ";font-family:var(--mono);}
details.more[open] summary::before{content:"– ";}
.hist{list-style:none;margin:6px 0 0;padding:0;border-left:1px solid var(--line-strong);}
.hist li{padding:0 0 10px 14px;position:relative;font-size:13.5px;}
.hist li::before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;background:var(--ink);}
.hist li.auto::before{background:var(--amber);}
.hist time{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);}
.ctxline{font-size:13.5px;margin:0 0 4px;}

/* calendar */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.calbar h2{font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;min-width:210px;}
.calbar .sp{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.chkl{display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.45fr));border-top:1px solid var(--line-strong);border-left:1px solid var(--line);}
.cal .dh{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line-strong);background:var(--surface);}
.cal .day{min-height:112px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--white);display:flex;flex-direction:column;gap:4px;min-width:0;}
.cal .day.out{background:var(--paper);}
.cal .day.out .dn{color:var(--faint);}
.cal .day.wk{background:var(--field);}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--red);}
.cal .dn{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--muted);}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid;padding:3px 6px;font-size:12px;line-height:1.25;cursor:pointer;background:var(--field);color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.chip b{font-family:var(--mono);font-size:11.5px;margin-right:4px;}
.chip.ok{border-color:var(--ok);background:var(--ok-tint);}
.chip.red{border-color:var(--red);background:var(--red-tint);}
.chip.muted{border-color:var(--line-strong);color:var(--muted-2);}
.chip.want{border:1px dashed var(--steel);border-left:3px dashed var(--steel);background:transparent;color:var(--steel);}
.chip.amber{border-color:var(--amber);background:var(--amber-tint);}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12px;color:var(--muted);}
.cal-legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border-left:3px solid;}
.lg-ok::before{border-color:var(--ok)!important;background:var(--ok-tint);} .lg-red::before{border-color:var(--red)!important;background:var(--red-tint);} .lg-amber::before{border-color:var(--amber)!important;background:var(--amber-tint);} .lg-want::before{border:1px dashed var(--steel)!important;border-left:3px dashed var(--steel)!important;} .lg-muted::before{border-color:var(--line-strong)!important;background:var(--field);}
@media (max-width:760px){.cal{grid-template-columns:repeat(5,minmax(0,1fr));}.cal .wkcol{display:none;}.cal .day{min-height:80px;}.chip b{display:block;margin:0;}.chip span{display:none;}}

/* modal sheet */
.modal{position:fixed;inset:0;background:rgba(20,21,22,.72);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 14px calc(env(safe-area-inset-bottom,0px) + 30px);overflow:auto;}
.sheet{background:var(--white);width:820px;max-width:100%;padding:30px 32px;border:1px solid var(--line);position:relative;}
@media (max-width:760px){.sheet{padding:22px 16px;}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px;}
.sheet-head .t{font-family:var(--cond);font-weight:600;font-size:24px;line-height:1;letter-spacing:.08em;text-transform:uppercase;}
.sheet-head .s{font-size:12px;color:var(--muted);margin-top:5px;}
.xbtn{border:1px solid var(--line-strong);background:transparent;width:38px;height:38px;font-size:20px;cursor:pointer;color:var(--muted);flex-shrink:0;}
.xbtn:hover{border-color:var(--ink);color:var(--ink);}
.results{border-top:1px solid var(--line-strong);max-height:360px;overflow:auto;}
.res{display:grid;grid-template-columns:104px minmax(0,1fr) 110px;gap:12px;width:100%;text-align:left;padding:10px 6px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;cursor:pointer;align-items:center;}
.res:hover{background:var(--field);}
.res small{display:block;color:var(--muted-2);font-size:11.5px;}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink);}
.seg button{flex:1 1 140px;min-height:48px;padding:6px 12px;border:0;background:var(--white);cursor:pointer;font-family:var(--cond);font-weight:600;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.seg button+button{border-left:1px solid var(--ink);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
.ordfacts{display:flex;gap:14px 30px;flex-wrap:wrap;padding:12px 14px;background:var(--field);margin-bottom:6px;}

.toast{display:flex;align-items:center;text-transform:uppercase;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;font-size:13px;font-weight:600;letter-spacing:.04em;z-index:90;max-width:90vw;}
footer{padding:16px 24px 26px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);}
/* tab bar (primary navigation) */
.tabbar{display:flex;gap:0;border:1px solid var(--ink);margin:0 0 18px;overflow-x:auto;background:var(--white);}
.tabbar a{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 18px;text-decoration:none;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.tabbar a+a{border-left:1px solid var(--ink);}
.tabbar a:hover{color:var(--ink);}
.tabbar a[aria-current="page"]{background:var(--ink);color:var(--paper);}
.tabbar .cnt{font-family:var(--mono);font-size:12px;font-weight:400;opacity:.75;}
.tabbar .cnt.hot{opacity:1;background:var(--red);color:#fff;font-weight:700;padding:1px 6px;}
.pagetitle{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 14px;}
.pagetitle h1{font-size:26px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
.pagetitle .sp{margin-left:auto;}
.pagetitle .search{margin:0;width:340px;max-width:100%;}

/* conversation thread */
.thread{display:flex;flex-direction:column;gap:8px;margin:4px 0 18px;}
.msg{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--steel);padding:10px 14px 11px;align-self:stretch;}
.msg.sales{}
.msg.prod{border-left-color:var(--ink);}
.msg.last{box-shadow:0 0 0 1px var(--line-strong);}
.msg-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.who{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;background:var(--steel-tint);color:var(--steel);}
.msg.prod .who{background:var(--ink);color:var(--paper);}
.act{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;}
.when{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap;}
.msg-d{margin-top:6px;font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15;}
.msg-d .of{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--muted);}
.msg-i{margin:4px 0 0;padding:0;list-style:none;font-size:13px;}
.msg-i li{display:flex;gap:10px;padding:1px 0;}
.msg-i .q{font-family:var(--mono);font-weight:700;min-width:64px;text-align:right;}
.msg-i .n{font-family:var(--mono);}
.msg-n{margin-top:6px;font-size:14px;}
.sys{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding:2px 0 2px 18px;display:flex;align-items:center;gap:10px;}
.sys::before{content:"";width:8px;height:8px;background:currentColor;flex-shrink:0;}
.sys.ok{color:var(--ok);} .sys.red{color:var(--red);} .sys.amber{color:var(--amber);}


.turn{border:1px solid var(--line);border-top:3px solid var(--red);background:var(--white);padding:16px 18px 18px;margin-bottom:14px;}
.turn.wait{border-top-color:var(--line-strong);}
.turn h3{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;margin:0 0 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;}
.turn h3 .r{margin-left:auto;font-family:var(--cond);font-size:16px;letter-spacing:.06em;}
.notebar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.notebar .din{flex:1 1 260px;}
.panel-foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;}
.badge-turn{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--red);padding:2px 6px;margin-left:8px;vertical-align:1px;}

.cx{color:var(--red);font-weight:700;}
.msg-wo{margin-top:6px;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);border:1px solid var(--steel-edge);background:var(--steel-tint);padding:3px 8px;}
.msg-wo.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-tint);}
.woconfirm{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border:1px dashed var(--line-strong);background:var(--field);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;}
.woconfirm em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted-2);}
.c-last{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);}

.groupbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ink);background:var(--white);margin:0 0 0;}
.groupbar a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:6px 14px;text-decoration:none;font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.15;}
.groupbar a+a{border-left:1px solid var(--ink);}
.groupbar a:hover{color:var(--ink);}
.groupbar a[aria-current="page"]{background:var(--ink);color:var(--paper);}
.gbadge{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--red);color:#fff;padding:2px 7px;letter-spacing:0;}

.subtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line-strong);margin:0 0 18px;padding-top:6px;}

.subtabs a:hover{color:var(--ink);}
.subtabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red);}
.subtabs .cnt{font-family:var(--mono);font-size:11.5px;font-weight:400;}
.subtabs .cnt.hot{background:var(--red);color:#fff;font-weight:700;padding:1px 6px;}
.newtag{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--steel);padding:1px 5px;vertical-align:1px;}
.chg-arrow{color:var(--muted-2);margin:0 6px;}
.dirlbl{display:inline-block;margin-left:12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);}
.din.item{font-family:var(--mono);text-transform:uppercase;width:160px;}
.stepcard{border:1px solid var(--line);border-top:3px solid var(--red);background:var(--white);padding:16px 18px 18px;margin-bottom:14px;}
.notice{border:1px solid var(--steel-edge);background:var(--steel-tint);color:var(--steel);padding:12px 16px;margin-bottom:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;}
.notice.ok{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.login{max-width:420px;margin:60px auto;background:var(--white);border:1px solid var(--line);border-top:3px solid var(--red);padding:26px 28px 24px;}
.login h1{font-size:26px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.login p{font-size:14.5px;}
.me{display:flex;flex-direction:column;align-items:flex-end;gap:4px;line-height:1.15;text-align:right;}
.me b{font-size:15px;font-weight:700;color:#1d1f20;}
.me .me-r{text-transform:uppercase;letter-spacing:.08em;}
.me .btn-link{color:#7a7a7d;margin-top:4px;font-size:11.5px;}
.adminbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:10px 24px;}
.adminbar .ab-l{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-right:4px;}
.btn-admin{min-height:40px;padding:0 18px;border:1px solid var(--paper);background:transparent;color:var(--paper);font-family:var(--cond);font-weight:600;font-size:14.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0;}
.btn-admin:hover{background:var(--paper);color:var(--ink);}
.adminbar .ab-s{margin-left:auto;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.adminbar .ab-s.stale{color:#ff8a8f;opacity:1;font-weight:700;}

const ORDERS=[],BY_SO={};const AS_OF_DATE='';

/* dates */
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fd=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd(d);};
const isWk=s=>{const g=pd(s).getDay();return g===0||g===6;};
const addBD=(s,n)=>{let d=s,st=n>=0?1:-1,c=Math.abs(n);while(c>0){d=addDays(d,st);if(!isWk(d))c--;}return d;};
const bdBetween=(a,b)=>{if(a===b)return 0;let sg=1;if(a>b){[a,b]=[b,a];sg=-1;}let n=0,d=a;while(d<b){d=addDays(d,1);if(!isWk(d))n++;}return n*sg;};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONL=['January','February','March','April','May','June','July','August','September','October','November','December'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let CLK=null;
const today=()=>{const t=fd(new Date());return t<AS_OF_DATE?AS_OF_DATE:t;};
const T=()=>CLK||today();
function fmt(s){if(!s)return '—';const d=pd(s),y=d.getFullYear();return `${d.getMonth()+1}/${d.getDate()}`+(y!==pd(today()).getFullYear()?`/${String(y).slice(2)}`:'');}
function fmtW(s){const d=pd(s);return `${WD[d.getDay()]} ${fmt(s)}`;}
function hm12(hm){let [h,m]=hm.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`;}
const fmtTs=t=>fmt(t.slice(0,10))+', '+hm12(t.slice(11,16));
const nowHM=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
let TM=null;const ts=()=>`${T()}T${TM||nowHM()}`;
const money=n=>n==null?'—':(Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(1)+'M':'$'+Math.round(n).toLocaleString('en-US'));
const num=n=>n==null?'—':(+n).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,w)=>`${num(n)} ${w}${n===1?'':'s'}`;
function ago(d){const n=bdBetween(d,T());return n<=0?'today':n===1?'1 business day ago':`${n} business days ago`;}



/* ===== state ===== */
let S={view:'viewer',requests:[],ev:[]};
const save=()=>{};
const isProd=()=>S.view==='production',isSales=()=>S.view==='sales';
const NAMES={production:'Production',sales:'Sales',auto:'System',viewer:'Viewer'};
const otherName=()=>isProd()?'Sales':'Production';

/* ===== groups ===== */
const GROUPS=[
  {k:'date',l:'Date change',tabs:['answer','waiting','upcoming','complete','closed','calendar']},
  {k:'check',l:'Confirm ESD / Check in',tabs:['answer','waiting','upcoming','complete','closed','calendar']},
  {k:'cancel',l:'Cancellation',tabs:['answer','waiting','done','closed']},
  {k:'change',l:'Change',tabs:['answer','waiting','upcoming','done','closed']}];
const G=k=>GROUPS.find(g=>g.k===k);
const TABL=()=>({answer:'Needs answer',waiting:`Waiting on ${otherName()}`,upcoming:'Upcoming',complete:'Complete',done:'Done',closed:'Closed',calendar:'Calendar'});

/* ===== model helpers ===== */
const R=id=>S.requests.find(r=>r.id===id);
const lineOf=(so,ln)=>{const o=BY_SO[so];return (o&&o.lines.find(l=>l.ln===ln))||GHOST[so+'|'+ln];};
const isWhole=(so,lines)=>{const o=BY_SO[so];if(!o.lines.length)return true;return o.lines.length===lines.length&&o.lines.every(l=>{const x=lines.find(y=>y.ln===l.ln);return x&&x.qty>=l.rem;});};
function scopeText(r,lines){lines=lines||r.lines;if(isWhole(r.so,lines))return 'Whole order';const part=lines.some(x=>{const l=lineOf(r.so,x.ln);return l&&x.qty<l.rem;});return plural(lines.length,'item')+(part?', partial qty':'');}
function typeLabel(r){
  if(r.type==='date')return r.dir==='earlier'?'Pull-in':'Push-out';
  if(r.type==='check')return r.ask==='status'?'Status check':'Confirm ESD';
  if(r.type==='cancel')return 'Cancel';
  const q=r.changes.some(c=>c.newQty!=null),i=r.changes.some(c=>c.newItem);
  return (q&&i?'Qty + item':i?'Item':'Qty')+' change';
}
const COMMITTED=['committed','missed'],DONEC=['met','late'];
const datesOf=rows=>[...new Set(rows.map(x=>x.date))].sort();
function nextDue(r){const u=r.commit?r.commit.rows.filter(x=>!x.readyAt):[];return u.length?u.map(x=>x.date).sort()[0]:null;}
const doneDate=r=>r.commit&&r.commit.rows.every(x=>x.readyAt)?r.commit.rows.map(x=>x.readyAt).sort().pop():null;
const lateDays=r=>r.commit?Math.max(0,...r.commit.rows.filter(x=>x.readyAt).map(x=>daysBetween(x.date,x.readyAt))):0;
function listDates(ds){if(!ds.length)return '—';return ds.map(fmt).join(' + ');}
function overlaps(a,b){if(a.so!==b.so)return false;const s=new Set(a.lines.map(x=>x.ln));return b.lines.some(x=>s.has(x.ln));}
const rowsFrom=(lines,date)=>lines.map(x=>({ln:x.ln,qty:x.qty,date}));
function ballWith(r){
  if(['submitted','acknowledged','missed','cxl_wo','chg_wo'].includes(r.status))return 'production';
  if(['alternative','cxl_close','chg_sales'].includes(r.status))return 'sales';
  return null;
}
const isOverdue=r=>ballWith(r)&&r.status!=='missed'&&bdBetween(r.turn||r.created,T())>1;
const unread=r=>!!(r.unread&&r.unread[S.view]);
function statusOf(r){
  if(isOverdue(r))return {t:'Overdue',c:'red'};
  const s=isSales(),c=r.type==='check';
  switch(r.status){
    case 'submitted':return {t:r.rounds>1?'Countered':'New',c:'steel'};
    case 'acknowledged':return {t:r.rounds>1?'Countered':'Reviewing',c:'steel'};
    case 'alternative':return {t:s?'Answer offer':'With Sales',c:'amber'};
    case 'committed':return {t:c?'Confirmed':'Committed',c:'ok'};
    case 'missed':return {t:'Missed',c:'red'};
    case 'met':return {t:'On time',c:'ok'};
    case 'late':return {t:`Late ${lateDays(r)}d`,c:'redo'};
    case 'cannot':return {t:c?'Can’t confirm':'Can’t commit',c:'muted'};
    case 'cxl_wo':case 'chg_wo':return {t:s?'Deleting WOs':'Delete WOs',c:s?'steel':'amber'};
    case 'cxl_close':return {t:s?(r.full?'Close order':'Delete line'):'With Sales',c:'amber'};
    case 'chg_sales':return {t:s?'Make changes':'With Sales',c:'amber'};
    case 'cancelled':return {t:r.full?'Order cancelled':'Line cancelled',c:'ok'};
    case 'changed':return {t:'Changed',c:'ok'};
    case 'cxl_denied':return {t:'Can’t cancel',c:'muted'};
    case 'chg_denied':return {t:'Denied',c:'muted'};
    case 'declined':return {t:'Declined',c:'muted'};
    case 'expired':return {t:'Offer expired',c:'muted'};
    case 'withdrawn':return {t:'Withdrawn',c:'muted'};
    case 'superseded':return {t:'Replaced',c:'muted'};
  }
  return {t:r.status,c:'muted'};
}
function tabOf(r){
  const b=ballWith(r);
  if(COMMITTED.includes(r.status))return 'upcoming';
  if(b)return b===S.view?'answer':'waiting';
  if(DONEC.includes(r.status))return r.type==='change'?'done':'complete';
  if(['cancelled','changed'].includes(r.status))return 'done';
  return 'closed';
}
function listFor(g,tab){
  const Q=S.requests.filter(r=>r.type===g);
  const byC=(a,b)=>a.createdTs<b.createdTs?-1:1,byRecent=(a,b)=>(a.lastAt||'')<(b.lastAt||'')?1:-1;
  if(tab==='answer')return Q.filter(r=>ballWith(r)===S.view).sort((a,b)=>{const w=r=>r.status==='missed'||isOverdue(r)?0:1;return w(a)-w(b)||byC(a,b);});
  if(tab==='waiting')return Q.filter(r=>ballWith(r)&&ballWith(r)!==S.view&&r.status!=='missed').sort(byRecent);
  if(tab==='upcoming')return Q.filter(r=>COMMITTED.includes(r.status)).sort((a,b)=>(a.status==='missed'?0:1)-(b.status==='missed'?0:1)||((nextDue(a)||'9')<(nextDue(b)||'9')?-1:1));
  if(tab==='complete')return Q.filter(r=>DONEC.includes(r.status)).sort((a,b)=>(doneDate(a)||'')<(doneDate(b)||'')?1:-1);
  if(tab==='done')return Q.filter(r=>['cancelled','changed'].includes(r.status)||(g==='change'&&DONEC.includes(r.status))).sort(byRecent);
  if(tab==='closed')return Q.filter(r=>!ballWith(r)&&!COMMITTED.includes(r.status)&&!DONEC.includes(r.status)&&!['cancelled','changed'].includes(r.status)).sort(byRecent);
  return [];
}
const groupBadge=g=>listFor(g,'answer').length+S.requests.filter(r=>r.type===g&&unread(r)).length;

/* ===== actions ===== */
function ev(r,t,o){const e={req:r.id,at:ts(),ms:Date.now()*100+(SEQN++%100),by:S.view,name:S.view==='auto'||!ME?'':(ME.name||ME.email),t,...(o||{})};S.ev.push(e);BUF.push(e);r.lastAt=e.at;r.lastT=t;r.lastBy=S.view;r.lastName=e.name;return e;}
function sysEv(r,t,o){const pv=S.view;S.view='auto';ev(r,t,o);S.view=pv;}
function setTurn(r){r.turn=T();}
function firstAnswer(r){if(!r.firstAnswerAt)r.firstAnswerAt=ts();}
function createRequest(f){
  const o=BY_SO[f.so];
  const lines=f.lines&&f.lines.length?f.lines:(o.lines.length?o.lines.map(l=>({ln:l.ln,qty:l.rem})):[{ln:null,qty:null}]);
  const r={id:f.id,osnap:orderSnap(o),createdByName:ME?ME.name:'',so:f.so,type:f.type,dir:f.dir||null,ask:f.ask||null,lines,changes:f.changes||null,reqDate:f.reqDate||null,reason:f.reason,urgency:f.urgency||'Normal',by:S.view,created:T(),createdTs:ts(),turn:T(),status:'submitted',rounds:1,unread:{}};
  S.requests.push(r);
  ev(r,'request',{rows:f.type==='date'?rowsFrom(lines,r.reqDate):f.type==='cancel'?rowsFrom(lines,null):null,ref:'order',note:f.reason,changes:r.changes,date:r.reqDate,ask:r.ask});
  return r;
}
function acknowledge(r){r.status='acknowledged';ev(r,'ack');}
function supersedeFrom(r,lines,why){S.requests.forEach(q=>{if(q!==r&&['date','check'].includes(q.type)&&(COMMITTED.includes(q.status)||['submitted','acknowledged','alternative'].includes(q.status))&&overlaps(q,{so:r.so,lines})){q.status='superseded';sysEv(q,'superseded',{note:`${r.id}, ${why}`});}});}
function activate(r,rows){
  const o=BY_SO[r.so];
  r.commit={rows:rows.map(x=>({ln:x.ln,qty:x.qty,date:x.date,readyAt:o.ac||null})),revisions:0};
  r.status='committed';
  S.requests.forEach(q=>{if(q!==r&&q.type===r.type&&COMMITTED.includes(q.status)&&overlaps(q,r)){q.status='superseded';sysEv(q,'superseded',{note:r.id});}});
}
/* date change */
function dateDecide(r,outcome,rows,note){
  firstAnswer(r);setTurn(r);r.decision={outcome,note:note||'',rows:rows||null};
  if(outcome==='commit'){ev(r,'commit',{rows,ref:'request',reqLines:r.lines.map(x=>({...x})),note});activate(r,rows);}
  else if(outcome==='alternative'){r.status='alternative';r.offerExpires=addBD(T(),2);ev(r,'offer',{rows,ref:'request',reqLines:r.lines.map(x=>({...x})),note});}
  else{r.status='cannot';ev(r,'cant',{note});}
}
function dateCounter(r,lines,date,note){r.lines=lines;r.reqDate=date;r.dir=date<BY_SO[r.so].esd||BY_SO[r.so].esd<T()?'earlier':'later';r.rounds++;r.status='acknowledged';setTurn(r);r.decision=null;ev(r,'counter',{rows:rowsFrom(lines,date),ref:'order',note});}
/* check in */
function checkAnswer(r,kind,date,note){
  firstAnswer(r);setTurn(r);
  if(kind==='cant'){r.status='cannot';ev(r,'cant',{note});return;}
  const rows=rowsFrom(r.lines,date);ev(r,'chk_ok',{rows,ref:'request',reqLines:r.lines.map(x=>({...x})),note,kind,date});activate(r,rows);
}
/* shared offer answers (date + change) */
function accept(r){
  ev(r,'accept');
  if(r.type==='date')activate(r,r.decision.rows);
  else{r.agreedDate=r.offerDate;r.status='chg_wo';setTurn(r);}
}
function decline(r,note){r.status='declined';ev(r,'decline',{note});}
/* cancellation */
function cancelDecide(r,ok,rows,note){
  firstAnswer(r);setTurn(r);
  if(!ok){r.status='cxl_denied';ev(r,'cxl_no',{note});return;}
  r.cxl={rows};r.full=isWhole(r.so,rows);r.status='cxl_wo';ev(r,'cxl_ok',{rows,ref:'request',reqLines:r.lines.map(x=>({...x})),note});
}
function cancelWO(r,wo){setTurn(r);ev(r,'wo_del',{wo});r.status='cxl_close';}
function cancelClose(r,note){r.status='cancelled';r.doneAt=T();ev(r,'cxl_done',{note});supersedeFrom(r,r.cxl.rows,'cancelled');}
/* change */
function changeDecide(r,kind,date,note){
  firstAnswer(r);setTurn(r);
  if(kind==='approve'){r.agreedDate=r.reqDate;r.status='chg_wo';ev(r,'chg_ok',{note,date:r.reqDate});}
  else if(kind==='counter'){r.offerDate=date;r.status='alternative';r.offerExpires=addBD(T(),2);ev(r,'offer',{date,note});}
  else{r.status='chg_denied';ev(r,'chg_no',{note});}
}
function changeCounter(r,date,note){r.reqDate=date;r.rounds++;r.status='acknowledged';setTurn(r);ev(r,'counter',{date,note});}
function changeWO(r,wo){r.status='chg_sales';setTurn(r);ev(r,'wo_del',{wo});}
function changeDone(r,note){r.status='changed';r.doneAt=T();r.unread.production=true;ev(r,'chg_done',{note,date:r.agreedDate||null});supersedeFrom(r,r.lines,'changed');if(r.agreedDate)activate(r,r.changes.map(c=>({ln:c.ln,qty:c.newQty!=null?c.newQty:lineOf(r.so,c.ln).rem,date:r.agreedDate})));}
/* common */
function withdraw(r){r.status='withdrawn';ev(r,'withdraw');}
function changeDate(r,idxs,date,note){
  idxs.forEach(i=>{r.commit.rows[i].date=date;});
  const m=[];r.commit.rows.forEach(x=>{const f=m.find(y=>y.ln===x.ln&&y.date===x.date&&!y.readyAt&&!x.readyAt);if(f)f.qty+=x.qty;else m.push({...x});});
  r.commit.rows=m;r.commit.revisions++;r.status='committed';
  ev(r,'change',{rows:r.commit.rows.filter(x=>x.date===date),ref:'request',reqLines:r.lines.map(x=>({...x})),note});
}
function markComplete(r,ln){const rows=r.commit.rows.filter(x=>(ln===undefined||x.ln===ln)&&!x.readyAt);rows.forEach(x=>x.readyAt=T());ev(r,'complete',{rows:ln===undefined?null:rows,ref:'request',reqLines:r.lines.map(x=>({...x}))});}
function addNote(r,text){ev(r,'note',{note:text});}
function evaluate(){
  const t=T();
  S.requests.forEach(r=>{
    if(r.status==='alternative'&&t>r.offerExpires){r.status='expired';sysEv(r,'expired');}
    if(COMMITTED.includes(r.status)){
      const rows=r.commit.rows,oo=BY_SO[r.so];
      if(oo&&oo.ac&&!oo.gone&&rows.some(x=>!x.readyAt)){rows.forEach(x=>{if(!x.readyAt)x.readyAt=oo.ac;});sysEv(r,'complete',{note:'Actual Complete set in NetSuite '+fmt(oo.ac)});}
      if(rows.every(x=>x.readyAt)){const ok=rows.every(x=>x.readyAt<=x.date);r.status=ok?'met':'late';sysEv(r,ok?'met':'late');}
      else if(r.status==='committed'&&rows.some(x=>!x.readyAt&&t>x.date)){r.status='missed';setTurn(r);sysEv(r,'missed',{date:nextDue(r)});}
    }
  });
}
function as(view,date,time,fn){const pv=S.view;S.view=view;CLK=date;TM=time;fn();S.view=pv;CLK=null;TM=null;}

/* ===== list rows ===== */
const chevSvg='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
function keyDate(r){
  const short=ds=>fmt(ds[0])+(ds.length>1?` +${ds.length-1}`:'');
  if(DONEC.includes(r.status))return `Done ${fmt(doneDate(r))}<small>Due ${short(datesOf(r.commit.rows))}</small>`;
  if(r.commit&&COMMITTED.includes(r.status)){const n=bdBetween(T(),nextDue(r)||T());return `${short(datesOf(r.commit.rows))}<small class="${n<0?'red':''}">${n<0?`${-n} days late`:n===0?'Due today':`Due in ${n} day${n===1?'':'s'}`}</small>`;}
  if(r.type==='date'&&r.status==='alternative')return `${short(datesOf(r.decision.rows))}<small>Offered</small>`;
  if(r.type==='change'&&r.status==='alternative')return `${fmt(r.offerDate)}<small>Offered</small>`;
  if(['cancelled','changed'].includes(r.status))return `${fmt(r.doneAt)}<small>Done</small>`;
  if(r.type==='date')return `${fmt(r.reqDate)}<small>Requested</small>`;
  if(r.type==='check'){const o=BY_SO[r.so];return `${fmt(o.esd)}<small class="${o.esd<T()?'red':''}">${o.esd<T()?daysBetween(o.esd,T())+' days late':'ESD'}</small>`;}
  return `${fmt(r.created)}<small>Sent</small>`;
}
const EVTXT={request:'sent',counter:'countered',offer:'counter offer',commit:'committed',chk_ok:'answered',cant:'answered',accept:'accepted',decline:'declined',change:'new date',complete:'marked complete',note:'note',withdraw:'withdrew',ack:'acknowledged',missed:'missed',expired:'offer expired',met:'on time',late:'complete late',superseded:'replaced',cxl_ok:'approved',cxl_no:'denied',wo_del:'deleted work orders',cxl_done:'closed it out',cxl_line:'line cancelled',chg_ok:'approved',chg_no:'denied',chg_done:'made changes',attach:'uploaded files'};
function lastText(r){if(!r.lastT)return '';const n=bdBetween(r.lastAt.slice(0,10),T());return `${r.lastBy==='auto'?'':(r.lastName||NAMES[r.lastBy])+' '}${EVTXT[r.lastT]||r.lastT}, ${n<=0?'today':n===1?'yesterday':n+' days ago'}`;}
function rowHTML(r,g){
  const o=BY_SO[r.so],st=statusOf(r),open=UI.openId===r.id;
  const act=COMMITTED.includes(r.status)?`<button class="btn-ok" data-complete="${r.id}">Complete</button>`:`<button class="chevbtn" data-toggle="${r.id}" aria-label="${open?'Collapse':'Expand'} ${r.id}">${chevSvg}</button>`;
  const scope=r.type==='change'?plural(r.changes.length,'item'):r.type==='check'?'Whole order':scopeText(r);

  <button class="rq-row" data-toggle="${r.id}" aria-expanded="${open}">

    <span class="c-main"><span class="c-so">${esc(r.so)}</span><span class="c-cust">${esc(o.c)}</span>${unread(r)?'<span class="newtag">Update</span>':''}<span class="c-last">${esc(lastText(r))}</span></span>
    <span class="c-type up">${r.type==='cancel'?'<span class="cx">Cancel</span>':typeLabel(r)}${r.urgency==='High'?'<span class="hi">High</span>':''}${r.rounds>1?`<span class="rnd">Round ${r.rounds}</span>`:''}<small>${scope}</small></span>
    <span class="c-date up">${keyDate(r)}</span>
    <span class="c-st"><span class="pill ${st.c}">${st.t}</span></span>

}
const HEAD=dlabel=>`<div class="rq-line rq-headline" aria-hidden="true"><div class="rq-row rq-head"><span></span><span>Req</span><span>Order</span><span>Type</span><span>${dlabel}</span><span>Status</span></div><span></span></div>`;
const listHTML=(list,empty,dlabel)=>list.length?`<div class="rqs">${HEAD(dlabel||'Date')}${list.map(r=>rowHTML(r)).join('')}</div>`:`<div class="empty">${empty}</div>`;

/* ===== thread ===== */
function fact(k,v,cls){return `<div class="fact"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`;}
function itemList(r,rows,reqLines,restTxt){
  return `<ul class="msg-i">${rows.map(x=>{const l=x.ln!=null?lineOf(r.so,x.ln):null,rq=reqLines?reqLines.find(y=>y.ln===x.ln):null;return `<li><span class="q">${x.qty!=null?num(x.qty):''}</span><span class="n">${l?esc(l.item):'Whole order'}${rq&&rq.qty>x.qty?` <span class="hint">of ${num(rq.qty)}, ${restTxt}</span>`:''}</span></li>`;}).join('')}</ul>`;
}
function rowsBlock(r,e,head){
  const rows=e.rows||[];if(!rows.length)return '';
  const rest=r.type==='cancel'?'rest still ships':'rest stays on ESD';
  return datesOf(rows).map(d=>{
    const g=rows.filter(x=>x.date===d);
    const covers=e.ref==='order'?isWhole(r.so,g):(e.reqLines&&e.reqLines.every(x=>g.some(y=>y.ln===x.ln&&y.qty>=x.qty)));
    const label=e.ref==='order'?(covers?'Whole order':plural(g.length,'item')):(covers?'All requested items':plural(g.length,'item'));
    const h=head||('Ready by '+fmt(d));
    return `<div class="msg-d">${h} <span class="of">${label}</span></div>${covers?'':itemList(r,g,e.ref==='order'?null:e.reqLines,rest)}`;}).join('');
}
function changesBlock(r,changes){
  return `<ul class="msg-i">${changes.map(c=>{const l=lineOf(r.so,c.ln);const parts=[];
    if(c.newItem)parts.push(`<span class="n">${esc(l.item)}</span><span class="chg-arrow">→</span><span class="n"><b>${esc(c.newItem)}</b></span>`);else parts.push(`<span class="n">${esc(l.item)}</span>`);
    const q=c.newQty!=null?`<span class="q" style="min-width:0">${num(l.rem)}</span><span class="chg-arrow">→</span><span class="q" style="min-width:0">${num(c.newQty)}</span>`:`<span class="hint">qty ${num(l.rem)} unchanged</span>`;
    return `<li style="flex-wrap:wrap;gap:6px 14px"><span>${parts.join('')}</span><span>${q}</span></li>`;}).join('')}</ul>`;
}
const woBadge=(txt,cls)=>`<div class="msg-wo ${cls||''}">${txt}</div>`;
function threadHTML(r){
  const evs=S.ev.filter(e=>e.req===r.id);
  const lastParty=[...evs].reverse().find(e=>e.by!=='auto');
  return `<div class="thread">${evs.map(e=>{
    const sys=(txt,c)=>`<div class="sys ${c||''}">${txt}, ${fmt(e.at.slice(0,10))}</div>`;
    switch(e.t){
      case 'ack':return sys('Production acknowledged');
      case 'missed':return sys('Missed, not complete by '+fmt(e.date),'red');
      case 'expired':return sys('Offer expired, no answer','amber');
      case 'met':return sys('Complete on time','ok');
      case 'late':return sys(`Complete, ${plural(lateDays(r),'day')} late`,'red');
      case 'superseded':return sys('Replaced by '+esc(e.note));
      case 'accept':return sys('Sales accepted','ok');
      case 'cxl_line':return sys('Line cancelled. Sales notified','ok');
    }
    let label='',body='';
    switch(e.t){
      case 'request':
        if(r.type==='date'){label=`${typeLabel(r)} request`;body=rowsBlock(r,e);}

        else if(r.type==='cancel'){label='Cancel request';body=rowsBlock(r,e,'Cancel');}
        else{label='Change request';body=`<div class="msg-d">Change <span class="of">${plural(e.changes.length,'item')}</span></div>${changesBlock(r,e.changes)}${e.date?`<div class="msg-d" style="font-size:16px;margin-top:8px">Needed by ${fmt(e.date)}</div>`:''}`;}
        break;
      case 'counter':label='Counter';body=r.type==='change'?`<div class="msg-d">Needed by ${fmt(e.date)}</div>`:rowsBlock(r,e);break;
      case 'offer':label='Counter offer';body=r.type==='change'?`<div class="msg-d">Ready by ${fmt(e.date)} <span class="of">with the requested changes</span></div>`:rowsBlock(r,e);break;
      case 'commit':label='Committed';body=rowsBlock(r,e);break;
      case 'chk_ok':label=e.kind==='ontrack'?'On track':'New date';body=rowsBlock(r,e);break;
      case 'cant':label=r.type==='check'?'Can’t confirm':'Can’t commit';break;
      case 'decline':label='Declined';break;
      case 'change':label='New date';body=rowsBlock(r,e);break;
      case 'complete':label='Marked complete';body=e.rows?rowsBlock(r,{...e,rows:e.rows.map(x=>({...x,date:x.readyAt}))},'Complete'):'';break;
      case 'note':label='Note';break;

      case 'cxl_ok':label='Cancel approved';body=rowsBlock(r,e,'Cancel');break;

      case 'cxl_done':label=r.full?'Order closed out':'Line deleted';body=woBadge('Cancellation complete','ok');break;
      case 'chg_ok':label='Change approved';body=e.date?`<div class="msg-d">Ready by ${fmt(e.date)}</div>`:'';break;
      case 'chg_no':label='Change denied';break;
      case 'chg_done':label='Changes made';body=woBadge('Changed in NetSuite','ok')+(e.date?`<div class="msg-d" style="margin-top:8px">Ready by ${fmt(e.date)} <span class="of">tracked</span></div>`:'');break;

    const side=e.by==='production'?'prod':'sales';
    return `<div class="msg ${side} ${e===lastParty?'last':''}"><div class="msg-h"><span class="who">${NAMES[e.by]}</span><span class="act">${label}</span><span class="when">${e.name?esc(e.name)+", ":""}${fmtTs(e.at)}</span></div>${body}${e.note?`<div class="msg-n">${esc(e.note)}</div>`:''}</div>`;
  }).join('')}</div>`;
}

function readPicker(id){
  const out=[];let bad=false;
  document.querySelectorAll(`.${id}-ck`).forEach(c=>{if(!c.checked)return;const qi=document.querySelector(`.${id}-q[data-ln="${c.dataset.ln}"]`),q=+qi.value,max=+qi.max;if(!(q>0)||q>max)bad=true;else out.push({ln:+c.dataset.ln,qty:q});});
  return {rows:out,bad};
}
const choices=(name,opts)=>`<div class="choices c3" role="group">${opts.map((o,i)=>`<button type="button" data-${name}="${o[0]}" aria-pressed="${i===0}">${o[1]}<small>${o[2]}</small></button>`).join('')}</div>`;
const ackBtn=r=>r.status==='submitted'?'<button class="btn-ghost btn-sm" id="ack" style="margin-left:auto">Acknowledge</button>':'';
const changesTable=r=>`<div class="scroll"><table class="it"><thead><tr><th>Item</th><th class="r">Current qty</th><th>New item</th><th class="r">New qty</th></tr></thead><tbody>${r.changes.map(c=>{const l=lineOf(r.so,c.ln);return `<tr><td><div class="iname">${esc(l.item)}</div><div class="isub">${esc(l.desc)}</div></td><td class="r">${num(l.rem)}</td><td>${c.newItem?`<span class="iname">${esc(c.newItem)}</span>`:'<span class="hint">No change</span>'}</td><td class="r">${c.newQty!=null?`<b class="mono">${num(c.newQty)}</b>`:'<span class="hint">No change</span>'}</td></tr>`;}).join('')}</tbody></table></div>`;
function contextHTML(r){
  const o=BY_SO[r.so],t=T();
  const ls=r.lines.map(x=>x.ln!=null?lineOf(r.so,x.ln):null).filter(Boolean);
  const classes=[...new Set((ls.length?ls:o.lines).map(l=>l.cls))];
  const target=r.reqDate||o.esd,lo=addBD(target,-7),hi=addBD(target,7);
  const near=ORDERS.filter(x=>x.so!==r.so&&x.esd>=lo&&x.esd<=hi&&x.lines.some(l=>classes.includes(l.cls))).map(x=>({o:x,a:x.lines.filter(l=>classes.includes(l.cls)).reduce((s,l)=>s+(l.amt||0),0)})).sort((a,b)=>a.o.esd<b.o.esd?-1:1);
  const comms=S.requests.filter(q=>q!==r&&q.status==='committed'&&datesOf(q.commit.rows).some(d=>d>=lo&&d<=hi)&&BY_SO[q.so].lines.some(l=>classes.includes(l.cls)));
  const late=classes.map(c=>{let n=0,a=0;ORDERS.forEach(x=>{if(x.esd<t)x.lines.forEach(l=>{if(l.cls===c){n++;a+=l.amt||0;}});});return {c,n,a};}).sort((a,b)=>b.n-a.n).slice(0,3);
  return `<details class="more"><summary>Production load near ${fmt(target)}</summary><div class="card" style="margin-top:6px"><div class="facts" style="margin:0">
  ${fact('Due within a week',`${num(near.length)} orders, ${money(near.reduce((s,z)=>s+z.a,0))}`)}${fact('Other commitments that week',num(comms.length))}
  ${late.map(z=>fact(`${esc(z.c)} past ESD`,`${num(z.n)} lines, ${money(z.a)}`)).join('')}</div>
  ${near.length?`<div class="scroll" style="margin-top:10px"><table class="it"><thead><tr><th>Order</th><th>Customer</th><th>ESD</th><th class="r">$ In class</th></tr></thead><tbody>${near.slice(0,40).map(z=>`<tr><td class="mono"><b>${z.o.so}</b></td><td>${esc(z.o.c)}</td><td class="up">${fmt(z.o.esd)}${z.o.esd<t?`<span class="late-l">${plural(daysBetween(z.o.esd,t),'day')} late</span>`:''}</td><td class="r">${money(z.a)}</td></tr>`).join('')}</tbody></table></div>`:''}</div></details>`;
}
function commitCard(r){

  return `<div class="turn ${isProd()?'':'wait'}"><h3>${r.status==='missed'?'Missed':r.type==='check'?'Confirmed date':'Commitment'}<span class="r up" style="color:${n<0?'var(--red)':'var(--ok)'}">${listDates(datesOf(un.map(z=>z.x)))}, ${n<0?plural(-n,'day')+' late':n===0?'due today':'due in '+plural(n,'day')}</span></h3>
  ${multi?`<div class="scroll"><table class="it"><thead><tr><th>Item</th><th class="r">Qty</th><th>Ready by</th><th></th></tr></thead><tbody>${un.map(z=>{const l=z.x.ln!=null?lineOf(r.so,z.x.ln):null;return `<tr><td><div class="iname">${l?esc(l.item):'Whole order'}</div></td><td class="r">${z.x.ln!=null?num(z.x.qty):''}</td><td class="up">${fmt(z.x.date)}</td><td class="r"><button class="btn-ok" data-ready="${z.x.ln}">Complete</button></td></tr>`;}).join('')}</tbody></table></div>`:''}

  ${isProd()?`<div class="hidden" id="chgpane" style="margin-top:14px"><div class="scroll"><table class="it"><thead><tr><th></th><th>Item</th><th class="r">Qty</th><th>Was</th></tr></thead><tbody>${un.map(z=>{const l=z.x.ln!=null?lineOf(r.so,z.x.ln):null;return `<tr><td style="width:36px"><input type="checkbox" class="bx mv" data-i="${z.i}" checked aria-label="Move"></td><td><div class="iname">${l?esc(l.item):'Whole order'}</div></td><td class="r">${z.x.ln!=null?num(z.x.qty):''}</td><td class="up">${fmt(z.x.date)}</td></tr>`;}).join('')}</tbody></table></div>
    <div class="row"><div><label class="lbl" for="newd">New date</label><input class="din" type="date" id="newd"></div></div><label class="lbl" for="n-chg">Reason</label><textarea class="ta" id="n-chg"></textarea><div class="err" id="aerr" role="alert"></div>
    <div class="actions"><button class="btn-red" id="savechg">Save new date</button></div></div>`:''}</div>`;
}

const woCard=(r,title,rowsHtml)=>`<div class="turn"><h3>${title}</h3>${rowsHtml}

      ${choices('cx',[['all','Approve','Cancel everything requested'],...(canPart?[['part','Approve part','Some already made']]:[]),['no','Deny','Already made or shipped']])}
      <div id="cxpick" class="hidden" style="margin-top:12px">${itemPicker(r,r.lines.map(x=>({ln:x.ln,qty:x.qty,max:x.qty,ref:x.qty,checked:true})),{id:'cx',refLabel:'Requested',qtyLabel:'Can cancel'})}</div>
      <label class="lbl" for="cxnote" id="cxlbl">Note (optional)</label><textarea class="ta" id="cxnote"></textarea>
      <div class="err" id="aerr" role="alert"></div><div class="actions"><button class="btn-red" id="cxsend">Send</button><span class="hint up" id="cxhint">Next: delete the work orders</span></div></div>`;}
    if(P&&st==='cxl_wo')return woCard(r,'Delete the work orders in NetSuite',`<div class="scroll"><table class="it"><thead><tr><th>Item</th><th class="r">Cancel qty</th></tr></thead><tbody>${r.cxl.rows.map(x=>{const l=x.ln!=null?lineOf(r.so,x.ln):null;return `<tr><td><div class="iname">${l?esc(l.item):'Whole order'}</div></td><td class="r">${x.qty!=null?num(x.qty):'All'}</td></tr>`;}).join('')}</tbody></table></div>`);
    if(Sx&&st==='cxl_close')return `<div class="turn"><h3>${r.full?'Close out the order in NetSuite':'Delete the line on the Sales Order'}</h3>
      <div class="scroll"><table class="it"><thead><tr><th>Item</th><th class="r">Cancel qty</th></tr></thead><tbody>${r.cxl.rows.map(x=>{const l=x.ln!=null?lineOf(r.so,x.ln):null;return `<tr><td><div class="iname">${l?esc(l.item):'Whole order'}</div>${l?`<div class="isub">${esc(l.desc)}</div>`:''}</td><td class="r">${x.qty!=null?num(x.qty):'All'}</td></tr>`;}).join('')}</tbody></table></div>
      <label class="lbl" for="cxdn">Note (optional)</label><input class="din" id="cxdn" style="width:100%"><div class="err" id="aerr" role="alert"></div>
      <div class="actions"><button class="btn-red" id="cxdone">${r.full?'Order closed out':'Line deleted'}</button></div></div>`;
  }
  if(r.type==='change'){
    if(answering)return `<div class="turn"><h3>Your answer${ackBtn(r)}</h3>${changesTable(r)}
      ${r.reqDate?`<div class="facts" style="margin:12px 0 0">${fact('Date needed',fmt(r.reqDate),'big up')}${fact('Current ESD',fmt(o.esd),'up')}</div>`:''}
      <div style="margin-top:14px">${choices('cg',[['approve','Approve',r.reqDate?`Changes and ${fmt(r.reqDate)}`:'Make these changes'],...(r.reqDate?[['counter','Counter date','Date doesn’t work']]:[]),['deny','Deny','Can’t make the change']])}</div>
      <div class="row hidden" id="cgdate"><div><label class="lbl" for="cgd">Ready by</label><input class="din" type="date" id="cgd"></div></div>
      <label class="lbl" for="cgnote" id="cglbl">Note (optional)</label><textarea class="ta" id="cgnote"></textarea>
      <div class="err" id="aerr" role="alert"></div><div class="actions"><button class="btn-red" id="cgsend">Send</button><span class="hint up" id="cghint">Next: delete the work orders</span></div></div>`;
    if(Sx&&st==='alternative')return offerAnswerCard(r);
    if(P&&st==='chg_wo')return woCard(r,'Delete the work orders in NetSuite',changesTable(r));
    if(Sx&&st==='chg_sales')return `<div class="turn"><h3>Make the changes in NetSuite</h3>${changesTable(r)}${r.agreedDate?`<div class="facts" style="margin:12px 0 0">${fact('Agreed date',fmt(r.agreedDate),'big up')}</div>`:''}
      <label class="lbl" for="cgdn">Note (optional)</label><input class="din" id="cgdn" style="width:100%"><div class="err" id="aerr" role="alert"></div>
      <div class="actions"><button class="btn-red" id="cgdone">Changes made</button></div></div>`;
    if(st==='changed'&&P)return `<div class="notice ok">Changes made by Sales.</div>`;
  }
  const w=ballWith(r);
  if(w&&w!==S.view)return `<div class="turn wait"><h3 style="margin:0">Waiting on ${NAMES[w]}${r.status==='alternative'?`<span class="r up" style="color:var(--amber)">Offer open until ${fmtW(r.offerExpires)}</span>`:''}</h3>${isOverdue(r)?'<span class="hint up" style="color:var(--red)">Overdue, no answer after 1 business day</span>':''}</div>`;
  return '';
}
function factsHTML(r){
  const o=BY_SO[r.so],t=T(),late=o.esd<t?daysBetween(o.esd,t):0;
  const esdF=fact('ESD',fmt(o.esd)+(late?`<span class="late-l">${plural(late,'day')} late</span>`:''),'up');
  const tail=fact('Sent',fmt(r.created),'up')+fact('Unbilled',money(o.amt))+fact('Urgency',esc(r.urgency),'up'+(r.urgency==='High'?' red':''));
  if(r.type==='date'){const dl=daysBetween(r.reqDate,o.esd);return `<div class="facts">${esdF}${fact('Requested',fmt(r.reqDate)+(dl?`<span class="sub-l">${plural(Math.abs(dl),'day')} ${dl>0?'before':'after'} ESD</span>`:''),'up')}${tail}</div>`;}
  if(r.type==='check')return `<div class="facts">${esdF}${fact('Production ESD',fmt(o.pesd),'up')}${tail}</div>`;
  if(r.type==='cancel'){const v=r.lines.reduce((s,x)=>{const l=x.ln!=null?lineOf(r.so,x.ln):null;return s+(l&&l.amt&&l.rem?l.amt*x.qty/l.rem:0);},0);return `<div class="facts">${esdF}${fact('$ To cancel',money(o.lines.length?v:o.amt),'red')}${tail}</div>`;}
  return `<div class="facts">${esdF}${fact('Date needed',r.reqDate?fmt(r.reqDate):'No change','up')}${tail}</div>`;
}
function detailHTML(r){
  if(S.view==='viewer')return `${BY_SO[r.so].gone?'<div class="notice">Off the NetSuite backlog (shipped or closed)</div>':''}${factsHTML(r)}${threadHTML(r)}`;
  const canWithdraw=isSales()&&(['submitted','acknowledged','alternative'].includes(r.status)||COMMITTED.includes(r.status));
  return `${BY_SO[r.so].gone?'<div class="notice">Off the NetSuite backlog (shipped or closed)</div>':''}${factsHTML(r)}${threadHTML(r)}${turnHTML(r)}
  <div class="notebar"><input class="din" id="cmt" placeholder="Add a note for both teams" aria-label="Add a note"><button class="btn-ghost btn-sm" id="cmtb" style="min-height:42px">Add note</button>${canWithdraw?'<button class="btn-link" id="wd" style="margin-left:auto">Withdraw request</button>':''}</div>`;
}
function fmtSize(b){return b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB';}
function bindChoice(name,cb){let v=null;document.querySelectorAll(`[data-${name}]`).forEach((b,i)=>{if(i===0)v=b.dataset[name];b.onclick=()=>{v=b.dataset[name];document.querySelectorAll(`[data-${name}]`).forEach(z=>z.setAttribute('aria-pressed',z===b));const e=document.getElementById('aerr');if(e)e.textContent='';cb(v);};});if(v)cb(v);return ()=>v;}
function bindDetail(r){
  const $=id=>document.getElementById(id),err=m=>{const e=$('aerr');if(e)e.textContent=m;return false;};
  const before=snapshotReqs(),expect=r.status;BUF=[];
  const done=async(m,stay)=>{evaluate();DIRTY=false;const ok=await persist(r.id,expect,before);if(ok&&!stay&&tabOf(r)!==UI.tab)UI.openId=null;render();if(ok)toast(m);};
  const tog=id=>document.querySelectorAll(`.${id}-ck`).forEach(c=>c.onchange=()=>{document.querySelector(`.${id}-q[data-ln="${c.dataset.ln}"]`).disabled=!c.checked;});
  ['pa','sc','cx'].forEach(tog);
  const past=d=>d<T();
  if($('ack'))$('ack').onclick=()=>{acknowledge(r);done('Acknowledged',true);};
  /* date answer */
  if($('send')){
    let get;get=bindChoice('ch',v=>{$('pickwrap').classList.toggle('hidden',v!=='part');$('datewrap').classList.toggle('hidden',v==='cant');sync();});
    function sync(){const v=get?get():'all',ch=$('ansd').value!==r.reqDate;$('datenote').classList.toggle('hidden',v==='cant'||!(ch||v==='part'));$('notelbl').textContent=v==='all'&&!ch?'Note (optional)':'Reason';}
    $('ansd').oninput=sync;
    $('send').onclick=()=>{const v=get(),note=$('note').value.trim();
      if(v==='cant'){if(!note)return err('Add a reason.');dateDecide(r,'cannot',null,note);return done('Sent. Moved to Closed');}
      const d=$('ansd').value;if(!d)return err('Pick a ready date.');if(past(d))return err('That date is in the past.');
      if(v==='all'){const rows=rowsFrom(r.lines,d);if(d===r.reqDate){dateDecide(r,'commit',rows,note);return done(`Committed ${fmt(d)}. Moved to Upcoming`);}if(!note)return err('Add a reason for the new date.');dateDecide(r,'alternative',rows,note);return done('Counter offer sent to Sales');}
      const pk=readPicker('pa');if(pk.bad)return err('Check the quantities.');if(!pk.rows.length)return err('Pick at least one item.');
      if(r.lines.every(x=>pk.rows.some(y=>y.ln===x.ln&&y.qty>=x.qty)))return err('That’s everything. Use Complete.');if(!note)return err('Add a reason.');
      dateDecide(r,'alternative',rowsFrom(pk.rows,d),note);done('Counter offer sent to Sales');};
  }
  /* check answer */
  if($('cksend')){
    const get=bindChoice('ck',v=>{$('ckdate').classList.toggle('hidden',v!=='newdate');$('cklbl').textContent=v==='ontrack'?'Where it stands (optional)':'Where it stands';});
    $('cksend').onclick=()=>{const v=get(),note=$('cknote').value.trim();
      if(v==='ontrack'){checkAnswer(r,'ontrack',BY_SO[r.so].esd,note);return done('Confirmed. Moved to Upcoming');}
      if(!note)return err('Say where the order stands.');
      if(v==='cant'){checkAnswer(r,'cant',null,note);return done('Sent. Moved to Closed');}
      const d=$('ckd').value;if(!d)return err('Pick a ready date.');if(past(d))return err('That date is in the past.');
      checkAnswer(r,'newdate',d,note);done(`Confirmed ${fmt(d)}. Moved to Upcoming`);};
  }
  /* cancel answer */
  if($('cxsend')){
    const get=bindChoice('cx',v=>{$('cxpick').classList.toggle('hidden',v!=='part');$('cxlbl').textContent=v==='all'?'Note (optional)':'Reason';$('cxhint').classList.toggle('hidden',v==='no');});
    $('cxsend').onclick=()=>{const v=get(),note=$('cxnote').value.trim();
      if(v==='no'){if(!note)return err('Add a reason.');cancelDecide(r,false,null,note);return done('Denied. Moved to Closed');}
      let rows=r.lines.map(x=>({...x}));
      if(v==='part'){const pk=readPicker('cx');if(pk.bad)return err('Check the quantities.');if(!pk.rows.length)return err('Pick at least one item.');if(r.lines.every(x=>pk.rows.some(y=>y.ln===x.ln&&y.qty>=x.qty)))return err('That’s everything. Use Approve.');if(!note)return err('Add a reason.');rows=pk.rows;}
      cancelDecide(r,true,rows,note);done('Approved. Now delete the work orders',true);};
  }
  if($('wodone'))$('wodone').onclick=()=>{const wo=$('wonum').value.trim();
    if(r.type==='cancel'){cancelWO(r,wo);return done(r.full?'Sent. Sales will close out the order':'Sent. Sales will delete the line');}
    changeWO(r,wo);done('Sent. Sales will make the changes');};
  if($('cxdone'))$('cxdone').onclick=()=>{cancelClose(r,$('cxdn').value.trim());done('Cancelled. Moved to Done');};
  /* change answer */
  if($('cgsend')){
    const get=bindChoice('cg',v=>{$('cgdate').classList.toggle('hidden',v!=='counter');$('cglbl').textContent=v==='approve'?'Note (optional)':'Reason';$('cghint').classList.toggle('hidden',v!=='approve');});
    $('cgsend').onclick=()=>{const v=get(),note=$('cgnote').value.trim();
      if(v==='approve'){changeDecide(r,'approve',null,note);return done('Approved. Now delete the work orders',true);}
      if(!note)return err('Add a reason.');
      if(v==='deny'){changeDecide(r,'deny',null,note);return done('Denied. Moved to Closed');}
      const d=$('cgd').value;if(!d)return err('Pick a date.');if(past(d))return err('That date is in the past.');if(d===r.reqDate)return err('Same as requested. Use Approve.');
      changeDecide(r,'counter',d,note);done('Counter offer sent to Sales');};
  }
  if($('cgdone'))$('cgdone').onclick=()=>{changeDone(r,$('cgdn').value.trim());done(r.agreedDate?'Changes done. Date tracked in Upcoming':'Changes done. Production notified');};
  /* offers */
  if($('acc'))$('acc').onclick=()=>{accept(r);done(r.type==='date'?'Accepted. Moved to Upcoming':'Accepted. Production will delete the work orders');};

    if(r.type==='date'){let lines=r.lines;if(BY_SO[r.so].lines.length){const pk=readPicker('sc');if(pk.bad)return err('Check the quantities.');if(!pk.rows.length)return err('Pick at least one item.');lines=pk.rows;}dateCounter(r,lines,d,n);}
    else changeCounter(r,d,n);

  /* commitments */
  if($('cmpl'))$('cmpl').onclick=()=>armed($('cmpl'),()=>{markComplete(r);done('Marked complete. Moved to Complete');});
  document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>{const v=b.dataset.ready;markComplete(r,v==='null'?null:+v);done('Item complete',true);});
  if($('chgopen'))$('chgopen').onclick=()=>$('chgpane').classList.toggle('hidden');
  if($('savechg'))$('savechg').onclick=()=>{const idx=[...document.querySelectorAll('.mv:checked')].map(c=>+c.dataset.i),d=$('newd').value,n=$('n-chg').value.trim();if(!idx.length)return err('Pick at least one item.');if(!d)return err('Pick the new date.');if(past(d))return err('That date is in the past.');if(!n)return err('Add a reason.');changeDate(r,idx,d,n);done(`New date ${fmt(d)}`,true);};
  const addN=()=>{const n=$('cmt').value.trim();if(!n)return;addNote(r,n);done('Note added',true);};
  if($('cmtb')){$('cmtb').onclick=addN;$('cmt').onkeydown=e=>{if(e.key==='Enter')addN();};}
  if($('wd'))$('wd').onclick=()=>armed($('wd'),()=>{withdraw(r);done('Withdrawn');});
}

const UI={g:'date',tab:'answer',q:'',openId:null,cal:null};
function parseHash(){const h=location.hash.slice(1).split('-');const g=G(h[0])?h[0]:'date';const tab=G(g).tabs.includes(h[1])?h[1]:'answer';UI.g=g;UI.tab=tab;}
const EMPTY={answer:'All caught up',waiting:'Nothing waiting',upcoming:'Nothing coming up',complete:'Nothing complete yet',done:'Nothing done yet',closed:'Nothing closed'};
function onTime(g){const Q=S.requests.filter(r=>r.type===g),m=Q.filter(r=>r.status==='met').length,n=Q.filter(r=>['met','late','missed'].includes(r.status)).length;return n?Math.round(m/n*100)+'%':'—';}
function avgAnswer(g){const xs=S.requests.filter(r=>r.type===g&&r.firstAnswerAt).map(r=>(new Date(r.firstAnswerAt)-new Date(r.createdTs))/36e5);if(!xs.length)return '—';const h=xs.reduce((a,b)=>a+b,0)/xs.length;return h<24?Math.max(1,Math.round(h))+' hrs':(h/24).toFixed(1)+' days';}
function avgLate(g){const xs=S.requests.filter(r=>r.type===g&&r.status==='late').map(lateDays);return xs.length?(xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(1)+' days':'—';}

function calendarHTML(g){
  if(!UI.cal){const d=pd(T());UI.cal={y:d.getFullYear(),m:d.getMonth()};}
  const {y,m}=UI.cal,first=new Date(y,m,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const items={},add=(d,x)=>{if(d)(items[d]=items[d]||[]).push(x);};

    if(r.commit&&[...COMMITTED,...DONEC].includes(r.status))datesOf(r.commit.rows).forEach(d=>add(d,{r,c:r.status==='missed'||r.status==='late'?'red':r.status==='committed'?'ok':'muted'}));

  return `<div class="calbar"><button class="btn-ghost btn-sm" id="cprev" aria-label="Previous month">‹</button><h2>${MONL[m]} ${y}</h2><button class="btn-ghost btn-sm" id="cnext" aria-label="Next month">›</button><button class="btn-ghost btn-sm" id="ctoday">Today</button></div>
