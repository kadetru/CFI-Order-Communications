      <div class="row ${can?'hidden':''}" id="ckdate"><div><label class="lbl" for="ckd">Ready by</label><input class="din" type="date" id="ckd"></div></div>
      <label class="lbl" for="cknote" id="cklbl">${can?'Where it stands (optional)':'Where it stands'}</label><textarea class="ta" id="cknote" placeholder="For example: in winding, couplings bonded Thursday"></textarea>
      <div class="err" id="aerr" role="alert"></div><div class="actions"><button class="btn-red" id="cksend">Send to Sales</button></div></div>`;}
  }
  if(COMMITTED.includes(st))return commitCard(r);
  if(r.type==='cancel'){
    if(answering){const canPart=r.lines.some(x=>x.ln!=null)&&!(r.lines.length===1&&r.lines[0].qty<=1);
      return `<div class="turn"><h3>Your answer${ackBtn(r)}</h3>
      ${choices('cx',[['all','Approve','Cancel everything requested'],...(canPart?[['part','Approve part','Some already made']]:[]),['no','Deny','Already made or shipped']])}
      <div id="cxpick" class="hidden" style="margin-top:12px">${itemPicker(r,r.lines.map(x=>({ln:x.ln,qty:x.qty,max:x.qty,ref:x.qty,checked:true})),{id:'cx',refLabel:'Requested',qtyLabel:'Can cancel'})}</div>
      <label class="lbl" for="cxnote" id="cxlbl">Note (optional)</label><textarea class="ta" id="cxnote"></textarea>
      <div class="err" id="aerr" role="alert"></div><div class="actions"><button class="btn-red" id="cxsend">Send</button><span class="hint up" id="cxhint">Next: delete the work orders</span></div></div>`;}
    if(P&&st==='cxl_wo')return woCard(r,'Delete the work orders in NetSuite',`<div class="scroll"><table class="it"><thead><tr><th>Item</th><th class="r">Cancel qty</th></tr></thead><tbody>${r.cxl.rows.map(x=>{const l=x.ln!=null?lineOf(r.so,x.ln):null;return `<tr><td><div class="iname">${l?esc(l.item):'Whole order'}</div></td><td class="r">${x.qty!=null?num(x.qty):'All'}</td></tr>`;}).join('')}</tbody></table></div>`);
    if(Sx&&st==='cxl_close')return `<div class="turn"><h3>${r.full?'Close out the order in NetSuite':'Delete the line on the Sales Order'}</h3>
      <div class="scroll"><table class="it"><thead><tr><th>Item</th><th class="r">Cancel qty</th></tr></thead><tbody>${r.cxl.rows.map(x=>{const l=x.ln!=null?lineOf(r.so,x.ln):null;return `<tr><td><div class="iname">${l?esc(l.item):'Whole order'}</div>${l?`<div class="isub">${esc(l.desc)}</div>`:''}</td><td class="r">${x.qty!=null?num(x.qty):'All'}</td></tr>`;}).join('')}</tbody></table></div>
      <label class="lbl" for="cxdn">Note (optional)</label><input class="din" id="cxdn" style="width:100%"><div class="err" id="aerr" role="alert"></div>
      <div class="actions"><button class="btn-red" id="cxdone">${r.full?'Order closed out':'Line deleted'}</button></div></div>`;
  }
  if(r.type==='change'){
    if(answering)return `<div class="turn"><h3>Your answer${ackBtn(r)}</h3>${changesTable(r)}
      ${r.reqDate?`<div class="facts" style="margin:12px 0 0">${fact('Date needed',fmt(r.reqDate),'big up')}${fact('Current ESD',fmt(o.esd),'up')}</div>`:''}
      <div style="margin-top:14px">${choices('cg',[['approve','Approve',r.reqDate?`Changes and ${fmt(r.reqDate)}`:'Make these changes'],...(r.reqDate?[['counter','Counter date','Date doesn’t work']]:[]),['deny','Deny','Can’t make the change']])}</div>
      <div class="row hidden" id="cgdate"><div><label class="lbl" for="cgd">Ready by</label><input class="din" type="date" id="cgd"></div></div>
      <label class="lbl" for="cgnote" id="cglbl">Note (optional)</label><textarea class="ta" id="cgnote"></textarea>
      <div class="err" id="aerr" role="alert"></div><div class="actions"><button class="btn-red" id="cgsend">Send</button><span class="hint up" id="cghint">Next: delete the work orders</span></div></div>`;
    if(Sx&&st==='alternative')return offerAnswerCard(r);
    if(P&&st==='chg_wo')return woCard(r,'Delete the work orders in NetSuite',changesTable(r));
    if(Sx&&st==='chg_sales')return `<div class="turn"><h3>Make the changes in NetSuite</h3>${changesTable(r)}${r.agreedDate?`<div class="facts" style="margin:12px 0 0">${fact('Agreed date',fmt(r.agreedDate),'big up')}</div>`:''}
      <label class="lbl" for="cgdn">Note (optional)</label><input class="din" id="cgdn" style="width:100%"><div class="err" id="aerr" role="alert"></div>
      <div class="actions"><button class="btn-red" id="cgdone">Changes made</button></div></div>`;
    if(st==='changed'&&P)return `<div class="notice ok">Changes made by Sales.</div>`;
  }
  const w=ballWith(r);
  /* "Waiting on ..." (with the offer deadline or the overdue note) is shown in the pinned turn band, see turnBand() */
  return '';
}
function factsHTML(r){
  const o=BY_SO[r.so],t=T(),late=o.esd<t?daysBetween(o.esd,t):0;
  const esdF=fact('ESD',fmt(o.esd)+(late?`<span class="late-l">${plural(late,'day')} late</span>`:''),'up');
  const tail=fact('Sent',fmt(r.created),'up')+fact('Requested by',esc(r.createdByName||'—'))+fact('Answered by',esc(r.answeredBy||'—'))+fact('Unbilled',money(o.amt))+fact('Urgency',esc(r.urgency),'up'+(r.urgency==='High'?' red':''))+schedFact(r.so);
  if(r.type==='date'){const dl=daysBetween(r.reqDate,o.esd);return `<div class="facts">${esdF}${fact('Requested',fmt(r.reqDate)+(dl?`<span class="sub-l">${plural(Math.abs(dl),'day')} ${dl>0?'before':'after'} ESD</span>`:''),'up')}${tail}</div>`;}
  if(r.type==='check')return `<div class="facts">${esdF}${fact('Production ESD',fmt(o.pesd),'up')}${tail}</div>`;
  if(r.type==='cancel'){const v=r.lines.reduce((s,x)=>{const l=x.ln!=null?lineOf(r.so,x.ln):null;return s+(l&&l.amt&&l.rem?l.amt*x.qty/l.rem:0);},0);return `<div class="facts">${esdF}${fact('$ To cancel',money(o.lines.length?v:o.amt),'red')}${tail}</div>`;}
  return `<div class="facts">${esdF}${fact('Date needed',r.reqDate?fmt(r.reqDate):'No change','up')}${tail}</div>`;
}
/* ===== thread pane (display only) =====

/* The open request: pinned record header, scrolling conversation, docked note composer.
   The class "rq-panel" is kept on purpose: the unsaved-typing guard at the bottom of this file looks for it. */
function detailHTML(r){

/* ===================== SCREEN UPDATES (display only) =====================
   The page used to be rebuilt from scratch on every change. Now the new HTML is
   compared with what is on screen and only the parts that differ are swapped.
   That keeps long lists fast, keeps scroll position and keyboard focus, and
   lets new rows and messages animate in on their own.

   How it reads the markup:
     data-k="..."   a stable name for an element, so it can be matched up
     data-deep      look inside this element and update its children one by one
     data-fresh     always replace this element (used for answer forms)
     data-enter     children that are new to this container animate in
     data-in        this element fades in when it first appears
     data-sig       when this value changes, the element flashes once (live update)

function morphKids(el,src){
  const had=[...el.children].some(c=>!c.hasAttribute('data-sk'));

  const anim=el.hasAttribute('data-enter')&&!QUIET;
  const news=[...src.children];

    const k=n.getAttribute('data-k');

    if(cur&&!k&&cur.hasAttribute('data-k'))cur=null;
    let use=n;
    if(cur&&cur.tagName===n.tagName&&!n.hasAttribute('data-fresh')){
      if(n.hasAttribute('data-deep')){syncAttrs(cur,n);morphKids(cur,n);use=cur;}

   acc      adhesives and accessories (CM-/FM- mix, guns, tips, tape, catalogs, samples, apparel): never scheduled
   elbow    "Elbow", or an angle x radius ("22-1/2 Degree x 72in Radius")
   conduit  "Conduit, 20 ft" or a conduit product class
   fitting  everything else (couplings, adapters, strut, hangers) */

  if(!l||typeof l==='string'){const c=(l||'').toLowerCase();return c.includes('elbow')?'elbow':c.includes('fitting')?'fitting':c.includes('conduit')&&!c.includes('misc')?'conduit':'fitting';}

  if(/^(CM|FM)[-\d]/.test(it)||/adhesive|cartridge|mixer tip|catalog|duffel|sample|repair tape|sanding|trucker|snapback/i.test(d)||c.includes('misc')||(!c&&!/^\s*[\d\-\/]+\s*(in\b|")/i.test(d)))return 'acc';

const wkLabel=w=>`${MON[pd(w).getMonth()]} ${pd(w).getDate()}`;

/* The promise an order is held to: an open portal commitment first, then the tracker / email

function promiseOf(so){
  const reqs=S.requests.filter(r=>r.so===so&&r.commit&&[...COMMITTED,...DONEC].includes(r.status));
  if(reqs.length){
    const open=reqs.filter(r=>COMMITTED.includes(r.status)),rows=open.flatMap(r=>r.commit.rows.filter(x=>!x.readyAt));
    const last=[...reqs].sort((a,b)=>(a.lastAt||'')<(b.lastAt||'')?-1:1).pop();
    const perLine={};rows.forEach(x=>{if(x.ln!=null&&(!perLine[x.ln]||x.date>perLine[x.ln]))perLine[x.ln]=x.date;});
    const missed=open.some(r=>r.status==='missed');
    return {portal:true,complete:!rows.length,perLine,reqs:reqs.map(r=>r.id),
      date:(rows.length?rows:reqs.flatMap(r=>r.commit.rows)).map(x=>x.date).sort().pop(),
      type:!rows.length?'Complete (Portal)':missed?'Missed (Portal)':'Portal Commitment',
      what:rows.map(x=>{const l=x.ln!=null?lineOf(so,x.ln):null;return `${l?num(x.qty)+' '+l.item:'Whole order'} by ${fmt(x.date)}`;}).join('; ')||'Everything Committed Is Ready',
      by:last.answeredBy||'',on:(last.lastAt||'').slice(0,10),src:'Order Communications '+reqs.map(r=>r.id).join(', ')};
  }
  const p=SCHED[so]&&SCHED[so].promise;
  return p&&(p.date||p.type)?{...p,portal:false,complete:false,perLine:{},reqs:[]}:null;
}
const linePromise=(p,ln)=>p?(p.perLine[ln]||p.date||null):null;
const isWeekly=p=>!!(p&&/weekly/i.test(p.type||''));

/* Where an order stands against its promise (same rules as the Excel Order Completion tab,
   with this week's Monday as the start of the schedule). */
function orderPlan(o){
  const tm=THISMON(),runs=runsOf(o.so),p=promiseOf(o.so);
  const toBuild=o.lines.reduce((s,l)=>s+(l.rem>0&&schedulable(l)?l.rem:0),0);
  const fut=runs.filter(x=>x.wk>=tm),sched=fut.reduce((s,x)=>s+(+x.qty||0),0);
  const wks=fut.map(x=>x.wk).sort(),first=wks[0]||null,finish=wks[wks.length-1]||null;
  const pw=p&&p.date?monOf(p.date):null,recurring=isWeekly(p);
  const late=pw&&finish?Math.max(0,Math.round(daysBetween(pw,finish)/7)):null;
  let st;
  if(!sched)st={t:'Not Scheduled',c:'red',k:'none'};
  else if(recurring)st={t:'Recurring, Ends Week '+fmt(finish),c:'steel',k:'rec'};
  else if(sched<toBuild)st={t:'Not Fully Scheduled',c:'amber',k:'part'};
  else if(!pw||p.complete)st={t:'No Promise',c:'muted',k:'nop'};
  else if(pw<tm)st={t:'Past Due, Done Week '+fmt(finish),c:'amber',k:'past'};
  else if(!late)st={t:'On Time',c:'ok',k:'ok'};
  else st={t:`Will Miss By ${plural(late,'Week')}`,c:'red',k:'miss'};
  return {o,p,runs,toBuild,sched,first,finish,pw,late,st,recurring};
}
const openOrders=()=>ORDERS.filter(o=>o.st!=='Stock'&&o.lines.some(l=>l.rem>0&&schedulable(l)));
function runFlag(o,x,p,lineSched){
  const tm=THISMON();
  if(x.wk<tm)return 'Past Week';
  if(!o||o.gone)return 'Order Off The Backlog';
  const l=x.ln!=null?o.lines.find(y=>y.ln===x.ln):null;
  if(x.ln!=null&&!l)return 'Line Shipped Or Closed';
  if(l&&lineSched>l.rem)return `Over By ${num(lineSched-l.rem)}`;
  const lp=linePromise(p,x.ln);
  if(lp&&!isWeekly(p)&&monOf(lp)>=tm&&x.wk>monOf(lp))return 'After Promise';
  return '';
}
function loadMap(){const m={};Object.values(SCHED).forEach(d=>(d.runs||[]).forEach(x=>{if(x.kind!=='elbow'||!x.bender)return;(m[x.wk]=m[x.wk]||{})[x.bender]=(m[x.wk][x.bender]||0)+(+x.hrs||0);}));return m;}
function lineSums(){const m={},tm=THISMON();Object.values(SCHED).forEach(d=>(d.runs||[]).forEach(x=>{if(x.wk>=tm){const k=d.so+'|'+x.ln;m[k]=(m[k]||0)+(+x.qty||0);}}));return m;}
function bestBender(size,wk,L){const bs=bendersFor(size);if(!bs.length)return null;return bs.map(b=>({n:b.n,free:b.hrs-((L[wk]||{})[b.n]||0)})).sort((a,c)=>c.free-a.free)[0].n;}
function weekOpts(sel){const tm=THISMON();let w=sel&&sel<tm?sel:tm;const out=[];for(;w<=addDays(tm,7*40);w=addDays(w,7))out.push(`<option value="${w}" ${w===sel?'selected':''}>Week of ${fmt(w)}</option>`);return out.join('');}
function benderOpts(size,sel){const bs=bendersFor(size);return bs.map(b=>`<option value="${b.n}" ${+sel===b.n?'selected':''}>Bender ${b.n}</option>`).join('')+(sel&&!bs.some(b=>b.n===+sel)?`<option value="${sel}" selected>Bender ${sel}</option>`:'');}
/* runs that land on the same line, week and bender become one */
function mergeRuns(runs){const out=[];runs.forEach(x=>{if(!(+x.qty>0))return;const m=out.find(y=>y.ln===x.ln&&y.wk===x.wk&&(y.bender||null)===(x.bender||null)&&y.kind===x.kind);if(m){m.qty=r2(m.qty+(+x.qty));m.hrs=hrsOf(m);}else out.push({...x,qty:+x.qty,hrs:hrsOf(x)});});return out;}
/* the earliest week with room on a bender that runs this size (finite-capacity placement) */
function fitTarget(o,l,qty,L){
  const kind=kindOf(l),size=sizeOf(l),start=FIRSTWK();
  if(kind!=='elbow'){const lp=linePromise(promiseOf(o.so),l.ln);let wk=lp?monOf(lp):start;if(wk<start)wk=start;return {wk,bender:null,fits:true};}
  const need=qty*rateFor(l.item,size);L=L||loadMap();

  return {wk:start,bender:bestBender(size,start,L),fits:false};

/* ----- saving: optimistic, one transaction per order, undoable ----- */
function runsText(runs){return runs.slice().sort((a,b)=>a.wk<b.wk?-1:1).map(x=>`${num(x.qty)} Week ${fmt(x.wk)}${x.bender?' B'+x.bender:''}`).join(' + ');}
function diffText(so,before,after){
  const lns=[...new Set([...before,...after].map(x=>x.ln))],out=[];
  lns.forEach(ln=>{const a=runsText(before.filter(x=>x.ln===ln)),b=runsText(after.filter(x=>x.ln===ln));if(a!==b){const l=lineOf(so,ln);out.push(`Line ${ln??'—'}${l?' '+l.item:''}: ${a||'nothing'} → ${b||'nothing'}`);}});
  return out.join('; ');
}
async function saveSched(so,runs,note,before){
  before=before||runsOf(so);
  const ref=doc(db,SCOL,so),base=SCHED[so]?SCHED[so].rev||0:0,text=diffText(so,before,runs);
  if(!text)return true;
  try{
    await runTransaction(db,async tx=>{
      const s=await tx.get(ref),cur=s.exists()?s.data():null;
      if((cur?cur.rev||0:0)!==base)throw new Error('STALE');
      tx.set(ref,{...(cur||{promise:null,notes:null,note:''}),so,runs:clean(runs),rev:base+1,updatedAt:nowTs(),updatedBy:ME.name||ME.email});
      tx.set(doc(collection(db,SCOL,so,'log')),{at:nowTs(),ms:Date.now(),by:ME.email,name:ME.name||ME.email,text,note:note||''});
    });
    if(SCHED[so]&&(SCHED[so].rev||0)<base+1)SCHED[so].rev=base+1;
    delete LOGS[so];return true;
  }catch(e){
    console.error(e);
    toast(e.message==='STALE'?`Someone else just changed ${so}. Showing theirs; make your change again.`:e.code==='permission-denied'?'You don’t have permission to edit the schedule.':'Couldn’t save. Check your connection and try again.');
    return false;
  }
}
/* changes: [{so,after}]. Applied on screen at once, then saved; reverted if a save fails. */
async function commitRuns(changes,label,quiet){
  const undo=[];
  changes.forEach(c=>{undo.push({so:c.so,before:runsOf(c.so).map(x=>({...x}))});SCHED[c.so]={...(SCHED[c.so]||{so:c.so,promise:null,notes:null,note:'',rev:0}),runs:c.after};});
  render();
  let ok=true;
  for(const c of changes){const u=undo.find(x=>x.so===c.so);if(!await saveSched(c.so,c.after,label,u.before)){ok=false;SCHED[c.so]={...SCHED[c.so],runs:u.before};}}
  if(ok){UNDO.push({label,items:undo});if(UNDO.length>40)UNDO.shift();if(!quiet)toast(label,()=>undoLast());}
  render();return ok;
}
async function undoLast(){
  const u=UNDO.pop();if(!u){toast('Nothing to undo');return;}
  for(const it of u.items){const cur=runsOf(it.so).map(x=>({...x}));SCHED[it.so]={...SCHED[it.so],runs:it.before};render();if(!await saveSched(it.so,it.before,'Undo: '+u.label,cur))SCHED[it.so]={...SCHED[it.so],runs:cur};}
  render();toast('Undone: '+u.label);
}
const runById=(so,id)=>runsOf(so).find(x=>x.id===id);
function moveRun(so,id,wk,bender){const x=runById(so,id);if(!x)return;
  const after=mergeRuns(runsOf(so).map(y=>y.id===id?{...y,wk,bender:bender??y.bender}:y));
  return commitRuns([{so,after}],`${so} ${x.item} moved to Week ${fmt(wk)}${(bender??x.bender)?' · Bender '+(bender??x.bender):''}`);}
function setQty(so,id,qty){const x=runById(so,id);if(!x)return;return commitRuns([{so,after:mergeRuns(runsOf(so).map(y=>y.id===id?{...y,qty}:y))}],`${so} ${x.item} set to ${num(qty)}`);}
function splitRun(so,id,qty,wk,bender){const x=runById(so,id);if(!x||!(qty>0)||qty>=x.qty)return toast('Split needs a quantity smaller than the run.');
  const after=mergeRuns([...runsOf(so).map(y=>y.id===id?{...y,qty:r2(y.qty-qty)}:y),{...x,id:newRunId(),qty,wk,bender:x.kind==='elbow'?(bender||x.bender):null,why:'Split in planner'}]);
  return commitRuns([{so,after}],`${so} ${x.item} split: ${num(qty)} to Week ${fmt(wk)}`);}
function removeRun(so,id){const x=runById(so,id);if(!x)return;UI.dw=null;return commitRuns([{so,after:runsOf(so).filter(y=>y.id!==id)}],`${so} ${x.item} removed from Week ${fmt(x.wk)}`);}
function addLine(so,ln,wk,bender,qty){const o=BY_SO[so],l=o&&o.lines.find(y=>y.ln===ln);if(!l||!(qty>0))return;
  const kind=kindOf(l),size=sizeOf(l),x={id:newRunId(),ln,item:l.item,size,wk,qty,bender:kind==='elbow'?(bender||bestBender(size,wk,loadMap())):null,kind,why:'Scheduled in planner'};x.hrs=hrsOf(x);
  return commitRuns([{so,after:mergeRuns([...runsOf(so).map(y=>({...y})),x])}],`${so} ${l.item}: ${num(qty)} added to Week ${fmt(wk)}${x.bender?' · Bender '+x.bender:''}`);}
function needOf(so,ln){const o=BY_SO[so],l=o&&o.lines.find(y=>y.ln===ln);if(!l)return 0;const tm=THISMON();return Math.max(0,l.rem-runsOf(so).filter(x=>x.ln===ln&&x.wk>=tm).reduce((s,x)=>s+(+x.qty||0),0));}
function autoFit(so,ln){const o=BY_SO[so],l=o&&o.lines.find(y=>y.ln===ln),q=needOf(so,ln);if(!l||!q)return;const t=fitTarget(o,l,q);
  if(!t.fits)toast(`Too big for one bender-week. Placed on the least-loaded bender in Week ${fmt(t.wk)}; split it.`);
  return addLine(so,ln,t.wk,t.bender,q);}
/* ----- elbow planning, 3 weeks ahead -----
   Recurring lines (a qty every 1, 2 or 3 weeks, set on the line) are placed first; the open
   bender capacity left is then filled with the most past-due orders (earliest NetSuite ESD first),
   splitting a line across benders and weeks when it doesn't fit in one. */
const planWeeks=()=>[...Array(PLAN_WEEKS)].map((_,i)=>addDays(FIRSTWK(),7*i));
const EVERYL={1:'Every Week',2:'Every 2 Weeks',3:'Every 3 Weeks'};
/* recur[line] = {qty, every: 1|2|3, from: the Monday the cycle starts} (a bare number = every week) */
const normRec=v=>v==null?null:typeof v==='number'?{qty:v,every:1,from:FIRSTWK()}:{qty:+v.qty||0,every:[1,2,3].includes(+v.every)?+v.every:1,from:v.from||FIRSTWK()};
const recurOf=so=>{const r=(SCHED[so]&&SCHED[so].recur)||{},out={};Object.keys(r).forEach(k=>{const n=normRec(r[k]);if(n&&n.qty>0)out[k]=n;});return out;};
const recText=r=>`${num(r.qty)} ${EVERYL[r.every]}`;
function recurList(){const out=[];Object.keys(SCHED).forEach(so=>Object.entries(recurOf(so)).forEach(([ln,rec])=>{const o=BY_SO[so],l=o&&o.lines.find(y=>String(y.ln)===String(ln));out.push({so,ln:l?l.ln:+ln,rec,o,l});}));return out.sort((a,b)=>a.so<b.so?-1:1);}
const recWeeks=(rec,weeks)=>weeks.filter(w=>{const n=Math.round(daysBetween(rec.from,w)/7);return ((n%rec.every)+rec.every)%rec.every===0;});
/* runs for recurring lines in the planning weeks. reset: take that line's future recurring runs off first */
function recurRuns(items,reset){
  const weeks=planWeeks(),L=JSON.parse(JSON.stringify(loadMap())),after={},tm=THISMON();let n=0,pcs=0;
  items.forEach(({so,ln,rec,l})=>{
    if(!l)return;
    let runs=after[so]||runsOf(so).map(x=>({...x}));
    if(reset){runs.filter(x=>x.ln===ln&&x.why==='Recurring'&&x.wk>=tm).forEach(x=>{if(x.bender&&L[x.wk])L[x.wk][x.bender]=(L[x.wk][x.bender]||0)-(+x.hrs||0);});runs=runs.filter(x=>!(x.ln===ln&&x.why==='Recurring'&&x.wk>=tm));}
    if(rec){const size=sizeOf(l),kind=kindOf(l);
      recWeeks(rec,weeks).forEach(wk=>{
        const have=runs.filter(x=>x.ln===ln&&x.wk===wk).reduce((s,x)=>s+(+x.qty||0),0),left=Math.max(0,l.rem-runs.filter(x=>x.ln===ln&&x.wk>=tm).reduce((s,x)=>s+(+x.qty||0),0));
        const q=Math.min(rec.qty-have,left);if(q<=0)return;
        const b=kind==='elbow'?bestBender(size,wk,L):null,x={id:newRunId(),ln,item:l.item,size,wk,qty:q,bender:b,kind,why:'Recurring'};x.hrs=hrsOf(x);
        if(b)(L[wk]=L[wk]||{})[b]=((L[wk]||{})[b]||0)+x.hrs;runs.push(x);n++;pcs+=q;});}
    after[so]=runs;});
  return {changes:Object.keys(after).filter(so=>diffText(so,runsOf(so),after[so])).map(so=>({so,after:mergeRuns(after[so])})),n,pcs};
}
function placeRecurring(){
  const r=recurRuns(recurList(),false);
  if(!r.changes.length)return toast(recurList().length?`Recurring orders are already placed through the week of ${fmt(planWeeks()[PLAN_WEEKS-1])}.`:'No recurring orders yet. Click a line on the board or in the search and set it to recur.');
  return commitRuns(r.changes,`Recurring placed: ${plural(r.n,'run')}, ${num(r.pcs)} pcs`);
}
async function saveRecur(so,ln,rec){
  const ref=doc(db,SCOL,so),l=lineOf(so,ln),all={...((SCHED[so]&&SCHED[so].recur)||{})};
  if(rec)all[ln]={qty:rec.qty,every:rec.every,from:rec.from};else delete all[ln];
  const text=`Line ${ln}${l?' '+l.item:''}: `+(rec?`recurring ${recText(rec)}`:'no longer recurring');
  SCHED[so]={...(SCHED[so]||{so,runs:[],promise:null,notes:null,note:'',rev:0}),recur:all};render();
  try{
    let nr=0;
    await runTransaction(db,async tx=>{const s=await tx.get(ref),cur=s.exists()?s.data():{so,runs:[],promise:null,notes:null,note:'',rev:0};nr=(cur.rev||0)+1;
      tx.set(ref,{...cur,so,recur:all,rev:nr,updatedAt:nowTs(),updatedBy:ME.name||ME.email});
      tx.set(doc(collection(db,SCOL,so,'log')),{at:nowTs(),ms:Date.now(),by:ME.email,name:ME.name||ME.email,text,note:''});});
    if(SCHED[so]&&(SCHED[so].rev||0)<nr)SCHED[so].rev=nr;delete LOGS[so];
  }catch(e){console.error(e);toast('Couldn’t save. Check your connection and try again.');return false;}
  /* put it on the board right away (or take its recurring runs off) */
  const o=BY_SO[so],line=o&&o.lines.find(y=>y.ln===ln),r=recurRuns([{so,ln,rec,l:line}],true);
  if(r.changes.length)await commitRuns(r.changes,`${so} ${l?l.item:''}: ${rec?'recurring '+recText(rec)+', '+plural(r.n,'run')+' placed':'recurring runs removed'}`);
  else toast(`${so} ${text}`);
  return true;
}
function fillCandidates(){
  const LS=lineSums(),rec=new Set(recurList().map(x=>x.so+'|'+x.ln)),out=[];
  openOrders().forEach(o=>o.lines.forEach(l=>{if(l.rem<=0||kindOf(l)!=='elbow'||rec.has(o.so+'|'+l.ln))return;const need=l.rem-(LS[o.so+'|'+l.ln]||0);if(need>0)out.push({o,l,need});}));
  return out.sort((a,b)=>(a.o.esd||'9')<(b.o.esd||'9')?-1:(a.o.esd||'9')>(b.o.esd||'9')?1:((a.o.od||'')<(b.o.od||'')?-1:1));
}
function planFill(){
  const weeks=planWeeks(),L=JSON.parse(JSON.stringify(loadMap())),after={},placed=new Set();let pcs=0,hrs=0;
  const fullNow=()=>weeks.every(wk=>BENDERS().every(b=>b.hrs-((L[wk]||{})[b.n]||0)<.5));
  for(const c of fillCandidates()){
    if(fullNow())break;
    let need=c.need;const size=sizeOf(c.l),rate=Math.max(.001,rateFor(c.l.item,size)),bs=bendersFor(size);
    for(const wk of weeks){
      if(need<=0)break;
      const cand=bs.map(b=>({n:b.n,free:b.hrs-((L[wk]||{})[b.n]||0)})).filter(x=>x.free>=rate).sort((a,b)=>b.free-a.free);
      for(const b of cand){
        if(need<=0)break;const q=Math.min(need,Math.floor(b.free/rate+1e-9));if(q<1)continue;
        const runs=after[c.o.so]||(after[c.o.so]=runsOf(c.o.so).map(x=>({...x})));
        const x={id:newRunId(),ln:c.l.ln,item:c.l.item,size,wk,qty:q,bender:b.n,kind:'elbow',why:'Filled, most past due first'};x.hrs=hrsOf(x);
        runs.push(x);(L[wk]=L[wk]||{})[b.n]=((L[wk]||{})[b.n]||0)+x.hrs;need-=q;pcs+=q;hrs+=x.hrs;placed.add(c.o.so+'|'+c.l.ln);
      }
    }
  }
  return {after,lines:placed.size,orders:Object.keys(after).length,pcs,hrs};
}
function fillOldest(){
  const p=planFill();if(!p.lines)return toast(`No open capacity left in the next ${PLAN_WEEKS} weeks, or nothing left to place.`);
  return commitRuns(Object.keys(p.after).map(so=>({so,after:mergeRuns(p.after[so])})),`Filled ${plural(p.lines,'line')} from ${plural(p.orders,'order')}: ${num(p.pcs)} pcs, ${num(Math.round(p.hrs))} h`);
}
/* lines committed or confirmed in Order Communications and not yet ready, with their committed week */

  const out=[],tm=THISMON();
  S.requests.forEach(r=>{if(!r.commit||!COMMITTED.includes(r.status))return;const o=BY_SO[r.so];if(!o||o.gone)return;
    r.commit.rows.forEach(x=>{if(x.readyAt||!x.date)return;
      const ls=x.ln!=null?[o.lines.find(y=>y.ln===x.ln)].filter(Boolean):o.lines.filter(l=>l.rem>0);
      ls.filter(schedulable).forEach(l=>{const q=x.ln!=null?x.qty:l.rem,wk=monOf(x.date),by=runsOf(r.so).filter(y=>y.ln===l.ln&&y.wk>=tm&&y.wk<=wk).reduce((s,y)=>s+(+y.qty||0),0);
        out.push({so:r.so,o,l,ln:l.ln,qty:q,date:x.date,wk,req:r.id,missed:r.status==='missed',by,kind:kindOf(l)});});});});

/* every run in one bender-week (or conduit / fittings week) slides a week */
function cellRuns(wk,row){const out=[];Object.values(SCHED).forEach(d=>(d.runs||[]).forEach(x=>{if(x.wk!==wk)return;if(row==='conduit'||row==='fitting'?x.kind===row:(x.kind==='elbow'&&String(x.bender)===row))out.push({...x,so:d.so});}));return out;}
function shiftCell(wk,row,delta){const xs=cellRuns(wk,row);if(!xs.length)return;const ids=new Set(xs.map(x=>x.so+'|'+x.id)),to=addDays(wk,7*delta);
  const sos=[...new Set(xs.map(x=>x.so))];
  return commitRuns(sos.map(so=>({so,after:mergeRuns(runsOf(so).map(y=>ids.has(so+'|'+y.id)?{...y,wk:to}:y))})),`${plural(xs.length,'run')} moved from Week ${fmt(wk)} to Week ${fmt(to)}`);}
function lateIfShift(xs,delta){return xs.filter(x=>{const lp=linePromise(promiseOf(x.so),x.ln);if(!lp||isWeekly(promiseOf(x.so)))return false;const pw=monOf(lp),to=addDays(x.wk,7*delta);return x.wk<=pw&&to>pw;}).length;}
function loadLog(so){getDocs(query(collection(db,SCOL,so,'log'),orderBy('ms','desc'))).then(s=>{LOGS[so]=s.docs.map(d=>d.data());if(!DIRTY)render();}).catch(()=>{LOGS[so]=[];});}

const kpi=(k,v,label,cls,suf)=>`<div class="kpi ${cls||''}"><span class="n" data-ck="${k}" data-v="${v}">${(+v).toLocaleString('en-US')}${suf?`<small>${suf}</small>`:''}</span><span class="l">${label}</span></div>`;

function countUp(){
  document.querySelectorAll('[data-ck]').forEach(el=>{
    const k=el.dataset.ck,v=+el.dataset.v,from=COUNTS[k];COUNTS[k]=v;
    if(from===v||REDUCED.matches||!el.firstChild)return;
    const f=from==null?0:from,t0=performance.now(),dur=from==null?800:450;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);if(el.firstChild)el.firstChild.nodeValue=Math.round(f+(v-f)*e).toLocaleString('en-US');if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

/* ===== SIDEBAR (Schedule tab) =====
   Without a search: what Order Communications has committed and isn't scheduled yet, then every
   order with lines still needing a week, most past-due ESD first. With a search: the matching
   orders. Lines show by part number and drag onto the board. Elbows or conduit & fittings follow
   the toggle above the board. */

  const lineCard=(o,l,s,need)=>{const k=kindOf(l),drag=canSched()&&need>0,sel=UI.dw&&UI.dw.t==='line'&&UI.dw.so===o.so&&UI.dw.ln===l.ln,rec=recurOf(o.so)[l.ln];
    return `<div class="jc ${need?'':'done'} ${sel?'pick':''}" role="button" tabindex="0" data-k="t-${o.so}-${l.ln}" data-tl="${o.so}|${l.ln}" draggable="${drag}" title="${esc(l.item+'\n'+(l.desc||''))}">
    <span class="r1"><span class="it">${esc(l.item)}</span>${rec?'<span class="rtag">R</span>':''}<span class="q">${num(need||l.rem)}</span></span>
    <span class="r4"><span class="due">${KINDL[k]} · ${need?(s?`${num(s)} Scheduled, ${num(need)} To Go`:'Not Scheduled'):'All Scheduled'}</span>${drag&&k==='elbow'?`<button class="mini" data-autofit="${o.so}|${l.ln}" title="Place in the earliest week with room">Auto-Fit</button>`:''}</span></div>`;};
  const orderBlock=(o,all)=>{
    const ls=o.lines.filter(l=>l.rem>0&&mine(l)).map(l=>{const s=LS[o.so+'|'+l.ln]||0;return {l,s,need:Math.max(0,l.rem-s)};}).filter(x=>all||x.need>0);
    if(!ls.length&&!all)return '';

    ${ls.map(x=>lineCard(o,x.l,x.s,x.need)).join('')||`<p class="hint" style="margin:2px 0 0">No open ${elbow?'elbow':'conduit or fitting'} lines.</p>`}</div>`;};
  let body;
  if(q.length>=2){
    const os=Object.values(BY_SO).filter(o=>!o.gone&&(o.so+' '+o.c+' '+(o.po||'')).toLowerCase().includes(q)).sort((a,b)=>a.so<b.so?-1:1).slice(0,15);
    body=os.map(o=>orderBlock(o,true)).join('')||`<div class="tray-hint"><b>No Matches</b><span>Try the order number, customer name or PO.</span></div>`;
  }else{
    const cm=commitments().filter(c=>mine(c.l)&&c.by<c.qty).sort((a,b)=>a.date<b.date?-1:1);
    const cmH=cm.map(c=>{const need=c.qty-c.by,sel=UI.dw&&UI.dw.t==='line'&&UI.dw.so===c.so&&UI.dw.ln===c.ln;
      return `<div class="jc cm ${sel?'pick':''}" role="button" tabindex="0" data-k="cm-${c.req}-${c.ln}" data-tl="${c.so}|${c.ln}" draggable="${canSched()}" title="${esc(c.l.item+'\n'+(c.l.desc||''))}">
      <span class="r1"><span class="so">${c.so}</span><span class="q">${num(need)}</span></span><span class="c">${esc(c.o.c)}</span>
      <span class="r3"><span class="it">${esc(c.l.item)}</span></span>
      <span class="r4"><span class="due">${c.req} · ${c.missed?'Missed, ':''}Due ${fmt(c.date)}${c.by?` · ${num(c.by)} Scheduled`:''}</span>${canSched()&&kindOf(c.l)==='elbow'?`<button class="mini" data-autofit="${c.so}|${c.ln}">Auto-Fit</button>`:''}</span></div>`;}).join('');
    const os=openOrders().filter(o=>o.lines.some(l=>l.rem>0&&mine(l)&&(LS[o.so+'|'+l.ln]||0)<l.rem)).sort((a,b)=>(a.esd||'9')<(b.esd||'9')?-1:(a.esd||'9')>(b.esd||'9')?1:((a.od||'')<(b.od||'')?-1:1));
    const MAXO=40;
    body=`<div class="tr-sec"><b>Committed <span>${cm.length}</span></b><span>In Order Communications, not on the schedule yet</span></div>${cmH||'<p class="hint" style="margin:0 2px 8px">Everything committed is scheduled.</p>'}
    <div class="tr-sec"><b>Needs Scheduling <span>${os.length}</span></b><span>Most past-due ESD first</span></div>${os.slice(0,MAXO).map(o=>orderBlock(o,false)).join('')||'<p class="hint" style="margin:0 2px">Every open line has a week.</p>'}${os.length>MAXO?`<p class="hint" style="padding:6px 2px">Showing ${MAXO} of ${os.length}. Search to find others.</p>`:''}`;

  const qtyFor=ln=>runsFor(ln).reduce((a,y)=>a+(+y.qty||0),0);

    :r.type==='check'?(r.commit&&COMMITTED.includes(r.status)?datesOf(r.commit.rows).pop():o.esd):r.type==='change'?r.reqDate:null;
  let verdict,cls='steel';
  if(r.type==='cancel'){
    const hrs=lines.reduce((a,x)=>{let left=x.qty==null?Infinity:x.qty;return a+runsFor(x.ln).slice().reverse().reduce((h,y)=>{const t=Math.min(left,+y.qty||0);left-=t;return h+(y.kind==='elbow'?t*rateFor(y.item,y.size):0);},0);},0);

  const canFree=isProd()&&r.type==='cancel'&&['cxl_wo','cxl_close','cancelled'].includes(r.status)&&fin;
  return `<div class="simp" data-k="simp"><div class="simp-h"><b>Planner</b><span class="stk ${cls}">${esc(verdict)}</span></div>

}

function schedOrderStrip(so){
  if(!SCHED_READY||SCHED_ERR)return '';const o=BY_SO[so];if(!o)return '';const pl=orderPlan(o);
  return fact('On the schedule',pl.sched?`Done Week ${fmt(pl.finish)}<span class="sub-l">${num(pl.sched)} of ${num(pl.toBuild)}</span>`:'Not Scheduled','up');
}
function freeForCancel(r){
  const tm=THISMON(),rows=(r.cxl&&r.cxl.rows)||r.lines||[];let keep=runsOf(r.so).map(x=>({...x}));
  rows.forEach(c=>{
    if(c.ln==null){keep=keep.filter(x=>x.wk<tm);return;}
    let left=c.qty==null?Infinity:+c.qty;
    keep.filter(x=>x.ln===c.ln&&x.wk>=tm).sort((a,b)=>a.wk<b.wk?1:-1).forEach(x=>{const t=Math.min(left,x.qty);x.qty=r2(x.qty-t);left-=t;});
  });
  return commitRuns([{so:r.so,after:mergeRuns(keep)}],`${r.so}: cancelled qty taken off the schedule (${r.id})`);
}

async function saveEditReq(r,o){

  const name=ln=>{const l=lineOf(r.so,ln);return l?l.item:'Line '+ln;};
  const diffs=[];let lines,changes=null;

    changes=[];let bad='';
    picked.forEach(ln=>{const l=lineOf(r.so,ln),it=sh.querySelector(`.er-it[data-ln="${ln}"]`).value.trim().toUpperCase(),qv=sh.querySelector(`.er-nq[data-ln="${ln}"]`).value,nq=qv===''?null:+qv;

    if(bad)return err(bad);if(d&&d<t)return err('That date is in the past.');
    const old=new Map((r.changes||[]).map(c=>[c.ln,c]));
    changes.forEach(c=>{const p=old.get(c.ln);if(!p)diffs.push(`added ${name(c.ln)}`);else if((p.newItem||'')!==(c.newItem||'')||p.newQty!==c.newQty)diffs.push(`${name(c.ln)}: ${p.newItem||'same item'} / ${p.newQty??'same qty'} → ${c.newItem||'same item'} / ${c.newQty??'same qty'}`);});
    old.forEach((p,ln)=>{if(!changes.some(c=>c.ln===ln))diffs.push(`removed ${name(ln)}`);});
    lines=changes.map(c=>({ln:c.ln,qty:lineOf(r.so,c.ln).rem}));
  }else{
    let bad='';
    lines=picked.map(ln=>{const l=lineOf(r.so,ln),q=+sh.querySelector(`.er-q[data-ln="${ln}"]`).value;if(!(q>0)||q>l.rem)bad=bad||`Check the qty for ${l.item} (up to ${num(l.rem)}).`;return {ln,qty:q};});
    if(bad)return err(bad);
    if(r.type==='date'){if(!d)return err('Pick the date needed.');if(d<t)return err('That date is in the past.');}
    const old=new Map((r.lines||[]).map(x=>[x.ln,x.qty]));
    lines.forEach(x=>{if(!old.has(x.ln))diffs.push(`added ${name(x.ln)}, ${num(x.qty)}`);else if(old.get(x.ln)!==x.qty)diffs.push(`${name(x.ln)}: ${num(old.get(x.ln))} → ${num(x.qty)}`);});
    old.forEach((q,ln)=>{if(!lines.some(x=>x.ln===ln))diffs.push(`removed ${name(ln)}`);});
  }
  if((r.type==='date'||chg)&&(d||null)!==(r.reqDate||null))diffs.push(`date needed ${r.reqDate?fmt(r.reqDate):'none'} → ${d?fmt(d):'none'}`);
  if(!diffs.length)return err('Nothing changed.');
  const note=document.getElementById('er-n').value.trim();
  document.getElementById('er-save').disabled=true;
  const before=snapshotReqs();BUF=[];
  r.lines=lines;if(chg){r.changes=changes;r.reqDate=d||null;}

  addNote(r,`Request edited: ${diffs.join('; ')}${note?'. '+note:''}`);
  const ok=await persist(r.id,r.status,before);
  if(!ok){document.getElementById('er-save').disabled=false;return;}
  closeModal();render();toast(`${r.id} updated. Production was notified.`);
}

/* save everything that changed since `before`, in one transaction.
   mainId/expect: the request the user acted on must still have the status they saw. */
async function persist(mainId,expect,before){
  const changed=S.requests.filter(q=>before.get(q.id)!==JSON.stringify(q));
  const evs=BUF.splice(0);
  if(!changed.length&&!evs.length)return true;
  try{
    await runTransaction(db,async tx=>{
      if(mainId){const s=await tx.get(doc(db,'requests',mainId));
        if(expect==='__new__'){if(s.exists())throw new Error('STALE');}
        else if(!s.exists()||s.data().status!==expect)throw new Error('STALE');}
      changed.forEach(q=>tx.set(doc(db,'requests',q.id),clean(q)));
      evs.forEach(e=>tx.set(doc(collection(db,'requests',e.req,'events')),clean(e)));
    });
    return true;
  }catch(err){
    console.error(err);
    S.requests=[...before.values()].map(s=>JSON.parse(s));
    S.ev=S.ev.filter(e=>!evs.includes(e));
    toast(err.message==='STALE'?'Someone just updated this request. Showing the latest.':'Couldn’t save. Check your connection and try again.');
    return false;
  }
}
async function nextId(){
  const ref=doc(db,'counters','requests');
  const n=await runTransaction(db,async tx=>{const s=await tx.get(ref);const v=s.exists()?s.data().next:1001;tx.set(ref,{next:v+1});return v;});
  return 'R-'+n;
}
/* automatic checks: missed, expired offers, auto-complete from Actual Complete. Each request is
   written in its own transaction so two open browsers can't record the same event twice. */
async function runEvaluate(){
  if(!ME||!['sales','production'].includes(ME.role)||!READY)return;
  const before=snapshotReqs();BUF=[];
  evaluate();
  const changed=S.requests.filter(q=>before.get(q.id)!==JSON.stringify(q)),evs=BUF.splice(0);
  for(const q of changed){
    const exp=JSON.parse(before.get(q.id)).status,qe=evs.filter(e=>e.req===q.id);
    try{await runTransaction(db,async tx=>{const s=await tx.get(doc(db,'requests',q.id));if(!s.exists()||s.data().status!==exp)throw new Error('STALE');tx.set(doc(db,'requests',q.id),clean(q));qe.forEach(e=>tx.set(doc(collection(db,'requests',q.id,'events')),clean(e)));});}catch(e){}
  }
}
function watchEvents(){
  if(evFor===UI.openId)return;
  if(evUnsub){evUnsub();evUnsub=null;}
  evFor=UI.openId;S.ev=[];
  if(!evFor)return;
  evUnsub=onSnapshot(query(collection(db,'requests',evFor,'events'),orderBy('ms')),snap=>{S.ev=snap.docs.map(d=>d.data());if(DIRTY){PENDING=true;return;}render();});
}

function xDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;}

  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}

  const warn=[];let pending=0,noEsd=0;
  const items={},lines={};let lineCount=0;const seen=new Set();let dups=0;
  lrows.forEach(r=>{const so=xStr(colGet(r,LINE_COLS.so));if(!so||!/^SO/i.test(so))return;
    const ln=xNum(colGet(r,LINE_COLS.ln));const item=xStr(colGet(r,LINE_COLS.item))||'';
    if(seen.has(so+'|'+ln))dups++;seen.add(so+'|'+ln);
    if(item&&!items[item])items[item]={k:item,d:xStr(colGet(r,LINE_COLS.desc))||'',c:xStr(colGet(r,LINE_COLS.cls))||''};
    (lines[so]=lines[so]||[]).push({n:ln,i:item,q:xNum(colGet(r,LINE_COLS.qty)),b:xNum(colGet(r,LINE_COLS.billed)),r:xNum(colGet(r,LINE_COLS.rem)),a:xNum(colGet(r,LINE_COLS.amt))});lineCount++;});
  const orders=[];
  orows.forEach(r=>{const so=xStr(colGet(r,ORDER_COLS.so));if(!so||!/^SO/i.test(so))return;
    const st=xStr(colGet(r,ORDER_COLS.st))||'';if(/^pending$/i.test(st)){pending++;return;}
    const esd=xDate(colGet(r,ORDER_COLS.esd));if(!esd){noEsd++;return;}
    orders.push({so,c:xStr(colGet(r,ORDER_COLS.c))||'',po:xStr(colGet(r,ORDER_COLS.po)),od:xDate(colGet(r,ORDER_COLS.od)),esd,pesd:xDate(colGet(r,ORDER_COLS.pesd)),ac:xDate(colGet(r,ORDER_COLS.ac)),st,sm:xStr(colGet(r,ORDER_COLS.sm)),zip:xStr(colGet(r,ORDER_COLS.zip)),state:xStr(colGet(r,ORDER_COLS.state)),amt:xNum(colGet(r,ORDER_COLS.amt))||0,memo:xStr(colGet(r,ORDER_COLS.memo)),days:xNum(colGet(r,ORDER_COLS.days)),rep:xStr(colGet(r,ORDER_COLS.rep)),agency:xStr(agencyOf(r)),l:lines[so]||[]});});
  if(dups)warn.push(`${dups} duplicate Order # + Line # rows. Line # must be unique per order.`);
  if(noEsd)warn.push(`${noEsd} orders skipped because they have no Ship Date.`);
  const noLines=orders.filter(o=>!o.l.length).length;
  return {orders,items:Object.values(items),lineCount:orders.reduce((s,o)=>s+o.l.length,0),pending,noLines,warn};
}
function openImport(){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="sheet-head"><div><div class="t" id="mt">Import backlog</div><div class="s">Upload today’s two NetSuite saved-search exports.</div></div><button class="xbtn" data-close aria-label="Close">×</button></div>
  <label class="lbl" for="fo">Order backlog (.xlsx)</label><input class="din" type="file" id="fo" accept=".xlsx,.xls,.csv" style="width:100%;padding-top:8px">
  <label class="lbl" for="fl">Line item backlog (.xlsx)</label><input class="din" type="file" id="fl" accept=".xlsx,.xls,.csv" style="width:100%;padding-top:8px">
  <div id="isum"></div><div class="err" id="ierr" role="alert"></div>
  <div class="actions"><button class="btn-ghost" id="icheck">Check files</button><button class="btn-red hidden" id="igo">Upload to portal</button></div>`;
  openModal();
  let built=null;
  const $=id=>document.getElementById(id),err=m=>{$('ierr').textContent=m;};
  $('icheck').onclick=async()=>{err('');$('isum').innerHTML='';$('igo').classList.add('hidden');
    const fo=$('fo').files[0],fl=$('fl').files[0];if(!fo||!fl)return err('Choose both files.');
    let orows,lrows;try{[orows,lrows]=await Promise.all([readSheet(fo),readSheet(fl)]);}catch(x){return err('Couldn’t read one of the files. Export them again as .xlsx.');}
    if(colGet(orows[0]||{},'Line #')!==undefined&&colGet(lrows[0]||{},'Line #')===undefined)[orows,lrows]=[lrows,orows];
    const mo=missingCols(orows,ORDER_COLS,NEED_O),ml=missingCols(lrows,LINE_COLS,NEED_L);
    if(mo.length)return err('Order file is missing: '+mo.join(', '));
    if(ml.length)return err('Line item file is missing: '+ml.join(', '));
    built=buildImport(orows,lrows);
    const prev=META?META.orderCount:null,drop=prev&&built.orders.length<prev*0.7;
    $('isum').innerHTML=`<div class="facts perf" style="margin-top:16px">${fact('Orders',num(built.orders.length),'big')}${fact('Lines',num(built.lineCount),'big')}${fact('On hold (left out)',num(built.pending),'big')}${fact('Orders with no lines',num(built.noLines),'big')}${prev!=null?fact('Last import',num(prev)+' orders','big'):''}</div>
      ${built.warn.map(w=>`<div class="notice">${esc(w)}</div>`).join('')}${drop?'<div class="notice" style="color:var(--red-dark);border-color:var(--red-dark);background:var(--red-tint)">That’s over 30% fewer orders than last time. Make sure both exports are complete before uploading.</div>':''}`;
    if(!built.orders.length)return err('No orders found in the order file.');
    $('igo').classList.remove('hidden');
  };
  $('igo').onclick=async()=>{if(!built)return;$('igo').disabled=true;$('igo').textContent='Uploading…';
    try{
      const chunks=[];let cur=[],size=0;
      built.orders.forEach(o=>{const s=JSON.stringify(o).length;if(size+s>550000&&cur.length){chunks.push(cur);cur=[];size=0;}cur.push(o);size+=s;});if(cur.length)chunks.push(cur);
      const b=writeBatch(db);
      b.set(doc(db,'backlog','items'),{items:built.items});
      chunks.forEach((c,i)=>b.set(doc(db,'backlog','chunk_'+i),{orders:clean(c)}));
      const oldN=META?META.chunkCount||0:0;for(let i=chunks.length;i<oldN;i++)b.delete(doc(db,'backlog','chunk_'+i));
      b.set(doc(db,'backlog','meta'),{asOf:nowTs(),syncedAt:Date.now(),orderCount:built.orders.length,lineCount:built.lineCount,chunkCount:chunks.length,by:ME.name||ME.email});
      await b.commit();
      closeModal();toast(`Backlog updated: ${num(built.orders.length)} orders`);
    }catch(x){console.error(x);$('igo').disabled=false;$('igo').textContent='Upload to portal';err('Upload failed. Check your connection and try again.');}
  };
}

async function openUsers(){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="sheet-head"><div><div class="t" id="mt">Users</div><div class="s">Create each login in Firebase first (Authentication, Add user), then give it access here.</div></div><button class="xbtn" data-close aria-label="Close">×</button></div><div id="ulist"><div class="empty">Loading…</div></div>
  <div class="card" style="margin-top:16px"><h3>Add or update</h3><div class="row">
  <div style="flex:2 1 220px"><label class="lbl" for="ue">Email</label><input class="din" id="ue" type="email" style="width:100%"></div>
  <div style="flex:2 1 180px"><label class="lbl" for="un">Name</label><input class="din" id="un" style="width:100%"></div>
  <div><label class="lbl" for="ur">Role</label><select class="sel" id="ur"><option value="sales">Sales</option><option value="production">Production</option><option value="viewer">Viewer</option></select></div>
  <div><label class="lbl" for="ua">Admin</label><select class="sel" id="ua"><option value="no">No</option><option value="yes">Yes</option></select></div>
  <div><label class="lbl" for="um">Always emailed</label><select class="sel" id="um"><option value="no">No</option><option value="yes">Yes</option></select></div></div>
  <div class="err" id="uerr" role="alert"></div><div class="actions"><button class="btn-red" id="usave">Save user</button></div></div>`;
  openModal();
  const $=id=>document.getElementById(id);
  const load=async()=>{const s=await getDocs(collection(db,'roles'));const rows=s.docs.map(d=>({email:d.id,...d.data()})).sort((a,b)=>(a.role+a.name)<(b.role+b.name)?-1:1);
    $('ulist').innerHTML=`<div class="scroll"><table class="it"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Admin</th><th>Always emailed</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.name||'')}</td><td class="mono">${esc(u.email)}</td><td class="up">${esc(u.role)}</td><td class="up">${u.admin?'Yes':''}</td><td class="up">${u.always?'Yes':''}</td><td class="r"><button class="btn-link" data-uedit="${esc(u.email)}">Edit</button> <button class="btn-link" data-udel="${esc(u.email)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-uedit]').forEach(b=>b.onclick=()=>{const u=rows.find(x=>x.email===b.dataset.uedit);$('ue').value=u.email;$('un').value=u.name||'';$('ur').value=u.role;$('ua').value=u.admin?'yes':'no';$('um').value=u.always?'yes':'no';$('un').focus();});
    document.querySelectorAll('[data-udel]').forEach(b=>b.onclick=()=>armed(b,async()=>{if(b.dataset.udel===ME.email){$('uerr').textContent='You can’t remove yourself.';return;}await deleteDoc(doc(db,'roles',b.dataset.udel));load();}));};
  $('usave').onclick=async()=>{const em=$('ue').value.trim().toLowerCase(),nm=$('un').value.trim();if(!em||!em.includes('@'))return $('uerr').textContent='Enter a valid email.';if(!nm)return $('uerr').textContent='Enter a name.';
    try{await setDoc(doc(db,'roles',em),{email:em,name:nm,role:$('ur').value,admin:$('ua').value==='yes',always:$('um').value==='yes'});$('uerr').textContent='';$('ue').value='';$('un').value='';load();loadUsers();toast('User saved');}catch(x){$('uerr').textContent='Couldn’t save. Only admins can change users.';}};
  load();
}
