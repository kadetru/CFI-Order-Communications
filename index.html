/* ===================== ADMIN: IMPORT BACKLOG ===================== */
const ORDER_COLS={so:'Order #',od:'Date',ac:'Actual Complete',esd:'Ship Date',pesd:'Production ESD',st:'Order Status',po:'PO/Check Number',c:'Customer',sm:'Shipping Method',zip:'Shipping Zip',state:'Shipping State/Province',amt:'Amount Unbilled',memo:'Memo',days:'Days Open',rep:'Sales Rep'};
const LINE_COLS={so:'Order #',ln:'Line #',item:'Item',desc:'Description',cls:'Product Class',qty:'Quantity',billed:'Quantity Billed',rem:'Quantity Remaining',amt:'Amount Remaining'};
const NEED_O=['so','esd','c','st'],NEED_L=['so','ln','item','rem'];
async function readSheet(file){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});}
function xDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}
const xNum=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[$,]/g,''));return isNaN(n)?null:n;};
const xStr=v=>v==null?null:String(v).trim()||null;
function colGet(row,name){if(name in row)return row[name];const k=Object.keys(row).find(k=>k.trim().toLowerCase()===name.toLowerCase());return k?row[k]:undefined;}
function agencyOf(row){for(const k of ['Sales Rep.1','Sales Rep_1','Sales Rep 1']){if(k in row)return row[k];}return null;}
function missingCols(rows,map,need){if(!rows.length)return need.map(k=>map[k]);const r=rows[0];return need.filter(k=>colGet(r,map[k])===undefined).map(k=>map[k]);}
function buildImport(orows,lrows){
  const warn=[];let pending=0,noEsd=0;
  const items={},lines={};let lineCount=0;const seen=new Set();let dups=0;
  lrows.forEach(r=>{const so=xStr(colGet(r,LINE_COLS.so));if(!so||!/^SO/i.test(so))return;
    const ln=xNum(colGet(r,LINE_COLS.ln));const item=xStr(colGet(r,LINE_COLS.item))||'';
    if(seen.has(so+'|'+ln))dups++;seen.add(so+'|'+ln);
    if(item&&!items[item])items[item]={k:item,d:xStr(colGet(r,LINE_COLS.desc))||'',c:xStr(colGet(r,LINE_COLS.cls))||''};
    (lines[so]=lines[so]||[]).push({n:ln,i:item,q:xNum(colGet(r,LINE_COLS.qty)),b:xNum(colGet(r,LINE_COLS.billed)),r:xNum(colGet(r,LINE_COLS.rem)),a:xNum(colGet(r,LINE_COLS.amt))});lineCount++;});
  const orders=[];
  orows.forEach(r=>{const so=xStr(colGet(r,ORDER_COLS.so));if(!so||!/^SO/i.test(so))return;
    const st=xStr(colGet(r,ORDER_COLS.st))||'';if(/^pending$/i.test(st)){pending++;return;}
    const esd=xDate(colGet(r,ORDER_COLS.esd));if(!esd){noEsd++;return;}
    orders.push({so,c:xStr(colGet(r,ORDER_COLS.c))||'',po:xStr(colGet(r,ORDER_COLS.po)),od:xDate(colGet(r,ORDER_COLS.od)),esd,pesd:xDate(colGet(r,ORDER_COLS.pesd)),ac:xDate(colGet(r,ORDER_COLS.ac)),st,sm:xStr(colGet(r,ORDER_COLS.sm)),zip:xStr(colGet(r,ORDER_COLS.zip)),state:xStr(colGet(r,ORDER_COLS.state)),amt:xNum(colGet(r,ORDER_COLS.amt))||0,memo:xStr(colGet(r,ORDER_COLS.memo)),days:xNum(colGet(r,ORDER_COLS.days)),rep:xStr(colGet(r,ORDER_COLS.rep)),agency:xStr(agencyOf(r)),l:lines[so]||[]});});
  if(dups)warn.push(`${dups} duplicate Order # + Line # rows. Line # must be unique per order.`);
  if(noEsd)warn.push(`${noEsd} orders skipped because they have no Ship Date.`);
  const noLines=orders.filter(o=>!o.l.length).length;
  return {orders,items:Object.values(items),lineCount:orders.reduce((s,o)=>s+o.l.length,0),pending,noLines,warn};
}
function openImport(){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="sheet-head"><div><div class="t" id="mt">Import backlog</div><div class="s">Upload today’s two NetSuite saved-search exports.</div></div><button class="xbtn" data-close aria-label="Close">×</button></div>
  <label class="lbl" for="fo">Order backlog (.xlsx)</label><input class="din" type="file" id="fo" accept=".xlsx,.xls,.csv" style="width:100%;padding-top:8px">
  <label class="lbl" for="fl">Line item backlog (.xlsx)</label><input class="din" type="file" id="fl" accept=".xlsx,.xls,.csv" style="width:100%;padding-top:8px">
  <div id="isum"></div><div class="err" id="ierr" role="alert"></div>
  <div class="actions"><button class="btn-ghost" id="icheck">Check files</button><button class="btn-red hidden" id="igo">Upload to portal</button></div>`;
  openModal();
  let built=null;
  const $=id=>document.getElementById(id),err=m=>{$('ierr').textContent=m;};
  $('icheck').onclick=async()=>{err('');$('isum').innerHTML='';$('igo').classList.add('hidden');
    const fo=$('fo').files[0],fl=$('fl').files[0];if(!fo||!fl)return err('Choose both files.');
    let orows,lrows;try{[orows,lrows]=await Promise.all([readSheet(fo),readSheet(fl)]);}catch(x){return err('Couldn’t read one of the files. Export them again as .xlsx.');}
    if(colGet(orows[0]||{},'Line #')!==undefined&&colGet(lrows[0]||{},'Line #')===undefined)[orows,lrows]=[lrows,orows];
    const mo=missingCols(orows,ORDER_COLS,NEED_O),ml=missingCols(lrows,LINE_COLS,NEED_L);
    if(mo.length)return err('Order file is missing: '+mo.join(', '));
    if(ml.length)return err('Line item file is missing: '+ml.join(', '));
    built=buildImport(orows,lrows);
    const prev=META?META.orderCount:null,drop=prev&&built.orders.length<prev*0.7;
    $('isum').innerHTML=`<div class="facts perf" style="margin-top:16px">${fact('Orders',num(built.orders.length),'big')}${fact('Lines',num(built.lineCount),'big')}${fact('On hold (left out)',num(built.pending),'big')}${fact('Orders with no lines',num(built.noLines),'big')}${prev!=null?fact('Last import',num(prev)+' orders','big'):''}</div>
      ${built.warn.map(w=>`<div class="notice">${esc(w)}</div>`).join('')}${drop?'<div class="notice" style="color:var(--red-dark);border-color:var(--red-dark);background:var(--red-tint)">That’s over 30% fewer orders than last time. Make sure both exports are complete before uploading.</div>':''}`;
    if(!built.orders.length)return err('No orders found in the order file.');
    $('igo').classList.remove('hidden');
  };
  $('igo').onclick=async()=>{if(!built)return;$('igo').disabled=true;$('igo').textContent='Uploading…';
    try{
      const chunks=[];let cur=[],size=0;
      built.orders.forEach(o=>{const s=JSON.stringify(o).length;if(size+s>550000&&cur.length){chunks.push(cur);cur=[];size=0;}cur.push(o);size+=s;});if(cur.length)chunks.push(cur);
      const b=writeBatch(db);
      b.set(doc(db,'backlog','items'),{items:built.items});
      chunks.forEach((c,i)=>b.set(doc(db,'backlog','chunk_'+i),{orders:clean(c)}));
      const oldN=META?META.chunkCount||0:0;for(let i=chunks.length;i<oldN;i++)b.delete(doc(db,'backlog','chunk_'+i));
      b.set(doc(db,'backlog','meta'),{asOf:nowTs(),syncedAt:Date.now(),orderCount:built.orders.length,lineCount:built.lineCount,chunkCount:chunks.length,by:ME.name||ME.email});
      await b.commit();
      closeModal();toast(`Backlog updated: ${num(built.orders.length)} orders`);
    }catch(x){console.error(x);$('igo').disabled=false;$('igo').textContent='Upload to portal';err('Upload failed. Check your connection and try again.');}
  };
}

  $('usave').onclick=async()=>{const em=$('ue').value.trim().toLowerCase(),nm=$('un').value.trim();if(!em||!em.includes('@'))return $('uerr').textContent='Enter a valid email.';if(!nm)return $('uerr').textContent='Enter a name.';
    try{await setDoc(doc(db,'roles',em),{email:em,name:nm,role:$('ur').value,admin:$('ua').value==='yes',always:$('um').value==='yes'});$('uerr').textContent='';$('ue').value='';$('un').value='';load();loadUsers();toast('User saved');}catch(x){$('uerr').textContent='Couldn’t save. Only admins can change users.';}};
  load();
